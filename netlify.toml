[build]
  command = "npm --prefix scene-core install --ignore-scripts --no-audit --no-fund && npm --prefix viewer-next install --ignore-scripts --no-audit --no-fund && npm --prefix viewer-next run build"
  publish = "viewer-next/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
