name: M13 P0 Cold Archive Cumulative Index Scaffold

on:
  push:
    branches:
      - work/operations/m13-p0-cold-archive-cumulative-index-v0.2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m13-p0-cold-archive-cumulative-index-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize cumulative archive implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          Path("tools/cold_archive_plan.py").write_bytes(base64.b64decode("  nYnJhbmNoJ119OntpdGVtWyd oZWFkU2hhJ119IgogICAgICAgICAgICApCiAgICByZXR1cm4gc29ydGVkKG1lcmdlZC52YWx1ZXMoKSwga2V5PWxhbWJkYSBpdGVtOiAoaXRlbVsiYnJhbmNoIl0sIGl0ZW1bImhlYWRTaGEiXSkpCg=="))
          raise SystemExit("Scaffold payload intentionally truncated in transport")
          PY
