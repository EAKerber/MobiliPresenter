name: Governed Mutation Service

on:
  issue_comment:
    types: [created]

concurrency:
  group: governed-mutation-service-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  serve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'MobiliPresenter Remote Canonical Execution Bus' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'MOBILIPRESENTER_GOVERNED_MUTATION_REQUEST_V0_1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - name: Checkout current service carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse service request
        id: parse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/governed-mutation/evidence
          python tools/governed_mutation_service.py parse-event \
            --event "$GITHUB_EVENT_PATH" \
            --request-out /tmp/governed-mutation/request.json \
            --meta-out /tmp/governed-mutation/meta.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Materialize parse blocker
        if: steps.parse.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/governed-mutation/evidence
          python tools/governed_mutation_service.py event-failure \
            --event "$GITHUB_EVENT_PATH" \
            --blocker GOVERNED_MUTATION_PARSE_FAILED \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-dir /tmp/governed-mutation/evidence \
            --meta-out /tmp/governed-mutation/meta.json \
            --result /tmp/governed-mutation/result.json

      - name: Observe Work, re-entry and exact cycle
        if: steps.parse.outcome == 'success'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/governed_mutation_service.py prepare \
            --request /tmp/governed-mutation/request.json \
            --preparation /tmp/governed-mutation/preparation.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact begin artifact
        id: begin_artifact
        if: steps.prepare.outputs.state == 'READY'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.begin_artifact_name }}
          path: /tmp/governed-mutation/begin
          github-token: ${{ github.token }}
          run-id: ${{ steps.prepare.outputs.begin_run_id }}

      - name: Checkout exact cycle semantic host
        id: semantic_host
        if: steps.prepare.outputs.state == 'READY' && steps.begin_artifact.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.prepare.outputs.begin_source_sha }}
          path: semantic-host

      - name: Materialize begin transport blocker
        if: >-
          steps.prepare.outputs.state == 'READY' &&
          (steps.begin_artifact.outcome != 'success' || steps.semantic_host.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/governed_mutation_service.py transport-failure \
            --request /tmp/governed-mutation/request.json \
            --preparation /tmp/governed-mutation/preparation.json \
            --blocker GOVERNED_MUTATION_BEGIN_ARTIFACT_UNAVAILABLE \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-dir /tmp/governed-mutation/evidence \
            --result /tmp/governed-mutation/result.json

      - name: Serve blocked preparation
        if: steps.parse.outcome == 'success' && steps.prepare.outputs.state != 'READY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/governed_mutation_service.py execute \
            --request /tmp/governed-mutation/request.json \
            --meta /tmp/governed-mutation/meta.json \
            --preparation /tmp/governed-mutation/preparation.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-dir /tmp/governed-mutation/evidence \
            --result /tmp/governed-mutation/result.json

      - name: Execute through exact cycle semantic host
        if: >-
          steps.prepare.outputs.state == 'READY' &&
          steps.begin_artifact.outcome == 'success' &&
          steps.semantic_host.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python semantic-host/tools/governed_mutation_service.py execute \
            --request /tmp/governed-mutation/request.json \
            --meta /tmp/governed-mutation/meta.json \
            --preparation /tmp/governed-mutation/preparation.json \
            --begin-dir /tmp/governed-mutation/begin \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-dir /tmp/governed-mutation/evidence \
            --result /tmp/governed-mutation/result.json

      - name: Publish compact service result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/governed-mutation/result.json ]; then exit 0; fi
          service=tools/governed_mutation_service.py
          if [ -f semantic-host/tools/governed_mutation_service.py ] && [ "${{ steps.prepare.outputs.state }}" = "READY" ]; then
            service=semantic-host/tools/governed_mutation_service.py
          fi
          python "$service" publish \
            --meta /tmp/governed-mutation/meta.json \
            --result /tmp/governed-mutation/result.json

      - name: Preserve kitchen-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/governed-mutation/request.json
            /tmp/governed-mutation/meta.json
            /tmp/governed-mutation/preparation.json
            /tmp/governed-mutation/result.json
            /tmp/governed-mutation/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed on non-PASS result
        if: always()
        run: |
          if [ ! -f /tmp/governed-mutation/result.json ]; then exit 2; fi
          service=tools/governed_mutation_service.py
          if [ -f semantic-host/tools/governed_mutation_service.py ] && [ "${{ steps.prepare.outputs.state }}" = "READY" ]; then
            service=semantic-host/tools/governed_mutation_service.py
          fi
          python "$service" check-result --result /tmp/governed-mutation/result.json


  inspect_window:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'MobiliPresenter Remote Canonical Execution Bus' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'MOBILIPRESENTER_GOVERNED_MUTATION_INSPECT_V0_1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout inspection reader
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse kitchen-window request
        id: inspect_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/governed-inspection
          python tools/governed_mutation_service.py parse-inspection-event \
            --event "$GITHUB_EVENT_PATH" \
            --request-out /tmp/governed-inspection/request.json \
            --meta-out /tmp/governed-inspection/meta.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download referenced evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.inspect_request.outputs.artifact_name }}
          path: /tmp/governed-inspection/artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.inspect_request.outputs.run_id }}

      - name: Validate and open kitchen window
        run: |
          python tools/governed_mutation_service.py inspect-artifact \
            --request /tmp/governed-inspection/request.json \
            --artifact-dir /tmp/governed-inspection/artifact \
            --result /tmp/governed-inspection/result.json

      - name: Publish kitchen-window evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/governed_mutation_service.py publish-inspection \
            --meta /tmp/governed-inspection/meta.json \
            --result /tmp/governed-inspection/result.json
