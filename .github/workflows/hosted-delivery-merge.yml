name: Hosted Delivery Merge

on:
  issue_comment:
    types: [created]

concurrency:
  group: hosted-delivery-merge-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'MobiliPresenter Remote Canonical Execution Bus' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'MOBILIPRESENTER_DELIVERY_MERGE_REQUEST_V0_1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery host
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute closed delivery merge request
        id: delivery
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/hosted_delivery_merge.py \
            --event "$GITHUB_EVENT_PATH" \
            --request-out /tmp/delivery-merge-request.json \
            --dispatch-out /tmp/delivery-merge-dispatch.json \
            --result-out /tmp/delivery-merge-result.json

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-merge-${{ github.run_id }}
          path: /tmp/delivery-merge-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish delivery result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          test -f /tmp/delivery-merge-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.load(open('/tmp/delivery-merge-result.json', encoding='utf-8'))
          body='MOBILIPRESENTER_DELIVERY_MERGE_RESULT_V0_1\n```json\n'+json.dumps(value,indent=2,ensure_ascii=False)+'\n```'
          Path('/tmp/delivery-result-comment.json').write_text(json.dumps({'body':body},ensure_ascii=False),encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --input /tmp/delivery-result-comment.json

      - name: Require delivery PASS
        if: always()
        run: |
          test -f /tmp/delivery-merge-result.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/delivery-merge-result.json', encoding='utf-8'))
          if value.get('status') != 'PASS':
              raise SystemExit(1)
          if value.get('semanticAuthority') is not False or value.get('authorizesMutation') is not False:
              raise SystemExit(1)
          PY
