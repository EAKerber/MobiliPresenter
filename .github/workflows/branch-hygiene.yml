name: Branch Hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch remote refs
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Generate and validate fresh prune plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python tools/agent.py git prune-plan --json | tee /tmp/git-prune-plan.json
          python tools/prune_plan.py validate /tmp/git-prune-plan.json --json | tee /tmp/git-prune-plan-validation.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/git-prune-plan-validation.json'))
          open('/tmp/git-prune-plan-hash.txt','w').write(result['planHash'])
          PY

      - name: Apply exact plan with CAS readback
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILIPRESENTER_PRUNE_AUTHORIZED: '1'
        run: |
          set -o pipefail
          PLAN_HASH="$(cat /tmp/git-prune-plan-hash.txt)"
          python tools/prune_apply.py --plan /tmp/git-prune-plan.json --expected-plan "$PLAN_HASH" --json | tee /tmp/git-prune-apply.json

      - name: Validate apply result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/git-prune-plan-validation.json'))
          r=json.load(open('/tmp/git-prune-apply.json'))
          assert r['ok'] is True
          assert r['planHash']==p['planHash']
          assert r['readback']=='PASS'
          PY

      - name: Upload branch hygiene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-hygiene
          path: |
            /tmp/git-prune-plan.json
            /tmp/git-prune-plan-validation.json
            /tmp/git-prune-plan-hash.txt
            /tmp/git-prune-apply.json
          if-no-files-found: warn
