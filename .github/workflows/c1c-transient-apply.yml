name: C1C transient candidate
on:
  push:
    branches: ['work/operations/operational-boundary-cleanup-c1c']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact C1C transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'REPLACE_MISMATCH:{path}:{count}:{old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # SchedulerSnapshot: preserve the C1B pipeline and add consumer-time freshness only.
          replace_once('tools/scheduler_snapshot.py',
              'HEAD_KEYS = ("inspection", "control", "coordination", "continuation")\n',
              'HEAD_KEYS = ("inspection", "control", "coordination", "continuation")\nCURRENT_HEAD_KEYS = ("control", "coordination", "continuation")\n')
          replace_once('tools/scheduler_snapshot.py',
              '    return heads\n\n\ndef build_snapshot(machine, inspection, plan):',
              '''    return heads\n\n\ndef _validate_expected_heads(expected_heads):\n    if not isinstance(expected_heads, dict) or set(expected_heads) != set(CURRENT_HEAD_KEYS):\n        raise RuntimeError("SCHEDULER_SNAPSHOT_EXPECTED_HEADS_INVALID")\n    normalized = {}\n    for name in CURRENT_HEAD_KEYS:\n        sha = expected_heads.get(name)\n        if not isinstance(sha, str) or len(sha) != 40 or any(c not in "0123456789abcdef" for c in sha):\n            raise RuntimeError(f"SCHEDULER_SNAPSHOT_EXPECTED_{name.upper()}_HEAD_INVALID")\n        normalized[name] = sha\n    return normalized\n\n\ndef build_snapshot(machine, inspection, plan):''')
          replace_once('tools/scheduler_snapshot.py',
              'def validate_snapshot(value, *, source_machine, readback_machine):',
              'def validate_snapshot(value, *, source_machine, readback_machine, expected_heads=None):')
          replace_once('tools/scheduler_snapshot.py',
              '    if stale:\n        raise RuntimeError("SCHEDULER_SNAPSHOT_STALE_" + "_".join(name.upper() for name in stale))\n    return {"ok": True,',
              '''    if stale:\n        raise RuntimeError("SCHEDULER_SNAPSHOT_STALE_" + "_".join(name.upper() for name in stale))\n    if expected_heads is not None:\n        current = _validate_expected_heads(expected_heads)\n        stale_current = [name for name in CURRENT_HEAD_KEYS if value["sourceHeads"][name].get("sha") != current[name]]\n        if stale_current:\n            raise RuntimeError("SCHEDULER_SNAPSHOT_STALE_CURRENT_" + "_".join(name.upper() for name in stale_current))\n    return {"ok": True,''')
          replace_once('tools/scheduler_snapshot.py',
              '    validate.add_argument("--readback-machine", required=True)\n    validate.add_argument("--json", action="store_true", dest="as_json")',
              '''    validate.add_argument("--readback-machine", required=True)\n    validate.add_argument("--expected-control-head")\n    validate.add_argument("--expected-coordination-head")\n    validate.add_argument("--expected-continuation-head")\n    validate.add_argument("--json", action="store_true", dest="as_json")''')
          replace_once('tools/scheduler_snapshot.py',
              '        else:\n            payload = validate_snapshot(load_json(args.snapshot), source_machine=load_json(args.source_machine), readback_machine=load_json(args.readback_machine))',
              '''        else:\n            supplied_expected = [args.expected_control_head, args.expected_coordination_head, args.expected_continuation_head]\n            if any(item is not None for item in supplied_expected) and not all(item is not None for item in supplied_expected):\n                raise RuntimeError("SCHEDULER_SNAPSHOT_EXPECTED_HEADS_INCOMPLETE")\n            expected_heads = None if all(item is None for item in supplied_expected) else {\n                "control": args.expected_control_head,\n                "coordination": args.expected_coordination_head,\n                "continuation": args.expected_continuation_head,\n            }\n            payload = validate_snapshot(\n                load_json(args.snapshot),\n                source_machine=load_json(args.source_machine),\n                readback_machine=load_json(args.readback_machine),\n                expected_heads=expected_heads,\n            )''')

          # Prune: an open PR makes both its head and base live relationships.
          replace_once('tools/prune_plan.py',
              'def _protection_reasons(view,branch,open_pr_heads,*,published_source_branch=None):',
              'def _protection_reasons(view,branch,open_pr_heads,open_pr_bases,*,published_source_branch=None):')
          replace_once('tools/prune_plan.py',
              '    if branch in open_pr_heads:reasons.append("open-pr-head")\n    return reasons',
              '    if branch in open_pr_heads:reasons.append("open-pr-head")\n    if branch in open_pr_bases:reasons.append("open-pr-base")\n    return reasons')
          replace_once('tools/prune_plan.py',
              'open_pr_heads={str(pr["headRef"]) for pr in (pull_requests or []) if pr.get("state")=="open" and isinstance(pr.get("headRef"),str)};entries=[]',
              'open_pr_heads={str(pr["headRef"]) for pr in (pull_requests or []) if pr.get("state")=="open" and isinstance(pr.get("headRef"),str)};open_pr_bases={str(pr["baseRef"]) for pr in (pull_requests or []) if pr.get("state")=="open" and isinstance(pr.get("baseRef"),str)};entries=[]')
          replace_once('tools/prune_plan.py',
              '_protection_reasons(view,branch,open_pr_heads,published_source_branch=published_source_branch)',
              '_protection_reasons(view,branch,open_pr_heads,open_pr_bases,published_source_branch=published_source_branch)')
          replace_once('tools/prune_plan.py',
              '"openPrHeads":sorted(open_pr_heads),"entries":entries,',
              '"openPrHeads":sorted(open_pr_heads),"openPrBases":sorted(open_pr_bases),"entries":entries,')

          # Executor: reobserve both head and base use immediately before deletion.
          replace_once('tools/prune_apply.py',
              'def delete_remote_ref(repository: str, branch: str) -> None:',
              '''def observe_open_prs_using_branch(repository: str, branch: str) -> list[dict[str, Any]]:\n    by_number: dict[int, dict[str, Any]] = {}\n    for item in observe_open_prs_for_branch(repository, branch):\n        number = item.get("number")\n        if isinstance(number, int):\n            by_number[number] = item\n    base = quote(branch, safe="")\n    ok, payload = gh_json(f"repos/{repository}/pulls?state=open&base={base}&per_page=100")\n    if not ok or not isinstance(payload, list):\n        raise RuntimeError(f"OPEN_PR_BASE_READ_FAILED:{branch}")\n    for item in payload:\n        if isinstance(item, dict):\n            number = item.get("number")\n            if isinstance(number, int):\n                by_number[number] = item\n    return [by_number[key] for key in sorted(by_number)]\n\n\ndef delete_remote_ref(repository: str, branch: str) -> None:''')
          replace_once('tools/prune_apply.py',
              '        if observe_open_prs_for_branch(repository, branch):\n            raise RuntimeError(f"STALE_PLAN:OPEN_PR_APPEARED:{branch}")',
              '        if observe_open_prs_using_branch(repository, branch):\n            raise RuntimeError(f"STALE_PLAN:OPEN_PR_RELATION_APPEARED:{branch}")')

          # Coordination runtime must accept the same closed structural shape as its schema.
          replace_once('tools/coordination.py',
              'DEFAULT_INTENT_TTL_SECONDS = 30 * 60\n',
              '''DEFAULT_INTENT_TTL_SECONDS = 30 * 60\nSTATE_FIELDS = {"schemaVersion", "revision", "intents", "leases"}\nOWNER_FIELDS = {"role", "session", "branch", "pr"}\nINTENT_FIELDS = {"intentId", "resource", "owner", "reason", "createdAt", "expiresAt"}\nLEASE_FIELDS = {"leaseId", "resource", "mode", "owner", "reason", "acquiredAt", "renewedAt", "expiresAt", "ttlSeconds"}\n''')
          replace_once('tools/coordination.py',
              '    if not isinstance(owner, dict):\n        raise CoordinationError("OWNER_INVALID", "owner must be an object")\n    role =',
              '    if not isinstance(owner, dict):\n        raise CoordinationError("OWNER_INVALID", "owner must be an object")\n    if set(owner) != OWNER_FIELDS:\n        raise CoordinationError("OWNER_INVALID", "owner fields are invalid")\n    role =')
          replace_once('tools/coordination.py',
              '    if state.get("schemaVersion") != SCHEMA_VERSION:\n        raise CoordinationError("COORDINATION_STATE_INVALID", f"schemaVersion must be {SCHEMA_VERSION}")\n    if state.get("revision") is not None and not isinstance(state.get("revision"), str):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "revision must be null or a string")',
              '''    if set(state) != STATE_FIELDS:\n        raise CoordinationError("COORDINATION_STATE_INVALID", "root fields are invalid")\n    if state.get("schemaVersion") != SCHEMA_VERSION:\n        raise CoordinationError("COORDINATION_STATE_INVALID", f"schemaVersion must be {SCHEMA_VERSION}")\n    if state.get("revision") is not None and (not isinstance(state.get("revision"), str) or not state.get("revision")):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "revision must be null or a non-empty string")''')
          replace_once('tools/coordination.py',
              '    if not isinstance(intent, dict):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "intent must be an object")\n    _require_string(intent.get("intentId"),',
              '    if not isinstance(intent, dict):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "intent must be an object")\n    if set(intent) != INTENT_FIELDS:\n        raise CoordinationError("COORDINATION_STATE_INVALID", "intent fields are invalid")\n    _require_string(intent.get("intentId"),')
          replace_once('tools/coordination.py',
              '    if not isinstance(lease, dict):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "lease must be an object")\n    _require_string(lease.get("leaseId"),',
              '    if not isinstance(lease, dict):\n        raise CoordinationError("COORDINATION_STATE_INVALID", "lease must be an object")\n    if set(lease) != LEASE_FIELDS:\n        raise CoordinationError("COORDINATION_STATE_INVALID", "lease fields are invalid")\n    _require_string(lease.get("leaseId"),')

          # Normative entrypoint: keep only cross-role invariants.
          Path('AGENTS.md').write_text('''# MobiliPresenter — regras permanentes para agentes\n\n## Repositório e isolamento\n\n- Este repositório pertence exclusivamente ao projeto **MobiliPresenter**: `EAKerber/MobiliPresenter`.\n- Antes da primeira operação Git de uma conversa, confirme explicitamente o repositório ativo. Memória de outros projetos não concede acesso.\n- Não opere outro repositório sem nova autorização explícita.\n\n## Autoridade e conhecimento\n\n- Um fato mutável deve ter uma única authority e um writer canônico. Representações derivadas devem se declarar como tal.\n- Estado corrente pertence a authorities estruturadas; procedimento recorrente pertence a tooling; política/contrato permanente pertence a contratos; história permanece recuperável no Git/evidência.\n- Documentação narrativa não substitui estado observado. Snapshots derivados, handoffs, email e conversa de task nunca se tornam authority por conveniência.\n- Descubra contratos e capabilities correntes pelo repositório/tooling; não inferir comportamento pela idade de um documento ou pelo nome de uma versão.\n\n## Operação significativa\n\nOperações relevantes seguem conceitualmente:\n\n```text\nobserve -> plan -> validate -> apply -> readback\n```\n\n- Read-only por padrão quando a operação não exige mutação.\n- Drift, observação incompleta ou identidade divergente bloqueiam a operação; `UNKNOWN` nunca equivale a `PASS`.\n- Quando houver plano materializado/planHash/CAS/readback no contrato do domínio, não contorne essas etapas.\n- Operações destrutivas usam a mesma disciplina de evidência: não são proibidas por serem destrutivas, nem autorizadas por heurística de nome.\n- Acknowledgement de API não substitui readback independente.\n\n## Git e lifecycle\n\n- `main` é o branch de controle/publicação corrente.\n- Branch names são descritivos; não concedem por si sós retenção, authority, proteção ou elegibilidade de deleção.\n- PR/CI são observados no GitHub, não duplicados como verdade local.\n- Trabalho recuperável deve ser persistido na authority/branch apropriada antes de depender da continuidade de uma conversa ou runtime efêmero.\n\n## Limites de papel\n\n- Autoridade operacional não concede autoridade semântica sobre produto.\n- UI/UX, Engine, Scene Core e outros domínios mantêm seus semantic owners; um agente de processo não deve decidir conteúdo desses domínios para destravar fluxo.\n- Descobrir trabalho de outro papel não transfere ownership; dependências/handoffs devem ser materializados na authority apropriada.\n\n## Invariantes globais de produto\n\n- Câmera fixa/fixed-frame é requisito consolidado do viewer; não reabrir navegação 3D livre sem decisão explícita.\n- Dados físicos ou comerciais desconhecidos não devem ser inventados.\n\n## Bootstrap\n\nComece pelo estado/tooling corrente, não pela reconstrução do histórico:\n\n```bash\npython3 tools/agent.py status\n```\n\nUse `python3 tools/agent.py doctor` quando a capacidade do ambiente importar. Contratos semânticos transversais vivem em `ops/semantics/registry.json`.\n\nRegras específicas de papel pertencem aos Kickstarts correntes em `docs/kickstarts/roles/*-current.md`. Versões antigas são história, salvo referência explícita do documento corrente.\n''', encoding='utf-8')

          Path('docs/kickstarts/roles/manager-gitops-current.md').write_text('''# Manager / GitOps — current\n\nDocumento corrente e autocontido do papel: [`manager-gitops-v0.5.md`](./manager-gitops-v0.5.md).\n\nVersões anteriores permanecem como histórico e **não são importadas normativamente** pelo bootstrap corrente.\n\nUse este ponteiro apenas para localizar o contrato vigente; estado, capabilities e work continuam sendo descobertos nas authorities/tooling canônicos do repositório.\n''', encoding='utf-8')

          Path('docs/kickstarts/roles/manager-gitops-v0.5.md').write_text('''# MobiliPresenter — Manager / GitOps v0.5\n\n**Contrato corrente autocontido do papel `manager-gitops`.** Não importa normativamente versões anteriores.\n\n## Missão e limites\n\nManager/GitOps é o control plane operacional: observa authorities, valida coerência, deriva decisão operacional pelos artifacts canônicos, administra Git/CI/coordenação dentro da autorização vigente e falha fechado quando não existe continuação segura.\n\nAutoridade de processo não concede autoridade semântica sobre UI/UX, Engine, Scene Core ou produto.\n\nRepositório: `EAKerber/MobiliPresenter`. Agent Bus: `mobilipresenterchatbuss@gmail.com` (transporte, nunca authority).\n\n## Bootstrap por execução\n\n1. Confirme o repositório ativo.\n2. Observe o estado e ambiente:\n   `python3 tools/agent.py status --json`\n3. Quando capacidade do runtime importar:\n   `python3 tools/agent.py doctor --json`\n4. Descubra capabilities correntes:\n   `python3 tools/capability_gates.py list --json`\n5. Observe o estado operacional composto quando a decisão exigir authorities live:\n   `python3 tools/project_machine.py inspect --live --json`\n6. Derive downstream apenas a partir dessa observação materializada:\n   `python3 tools/maintenance_inspect.py --input <project-machine.json> --json`\n   `python3 tools/scheduler_plan.py --input <maintenance.json> --json`\n\nProjectMachine, Maintenance e SchedulerPlan são projections/artifacts derivados; não se tornam authority. Downstream não deve reobservar state silenciosamente para reconstruir uma decisão.\n\n## Authorities relevantes\n\n- ProjectState: `ops/state/project.json`.\n- Capability policy/Gates: `ops/capabilities/*.json`.\n- Coordination write ownership: branch `coordination/leases`.\n- Work/continuity: branch `coordination/continuations`.\n- Publicação corrente: manifesto apontado por ProjectState.\n- PR/CI e refs: GitHub observado.\n- Regras permanentes transversais: `AGENTS.md`.\n\nQuando consumir Work normalizado, use os campos semânticos correntes (`workerId`, `handoffToWorkerId`, `dependsOn`, `blockers`) expostos pelos artifacts/tooling; não faça parsing de campos históricos para decidir routing.\n\n## Scheduler e transporte\n\nSchedulerPlan é read-only, `semanticAuthority=false` e `transportSideEffects=false`. Transporte não pode reinterpretar target/action. `PAUSE` não vira trabalho; `NEEDS_HUMAN` não é redirecionado para outro papel por conveniência.\n\n## Fallback por Supervisor Snapshot\n\nQuando o runtime não consegue executar a observação live, o fallback permitido é o artifact `supervisor-snapshot` produzido com sucesso pelo workflow **Supervisor Snapshot** no `main` corrente.\n\n1. Observe independentemente os heads atuais de `main`, `coordination/leases` e `coordination/continuations`.\n2. Selecione um run bem-sucedido do Supervisor Snapshot cujo `head_sha` seja exatamente o `main` observado.\n3. Baixe o artifact dedicado e exija, no mínimo, `scheduler-snapshot.json`, `project-machine-source.json` e `project-machine-readback.json`.\n4. Valide localmente, sem reconstruir a decisão:\n\n```bash\npython3 tools/scheduler_snapshot.py validate \\\n  --snapshot scheduler-snapshot.json \\\n  --source-machine project-machine-source.json \\\n  --readback-machine project-machine-readback.json \\\n  --expected-control-head <MAIN_SHA> \\\n  --expected-coordination-head <LEASES_SHA> \\\n  --expected-continuation-head <WORK_SHA> \\\n  --json\n```\n\nA validação prova tanto a lineage/source-readback do artifact quanto sua frescura frente aos heads observados no momento do consumo. Qualquer mismatch, artifact ausente/expirado ou authority não observável é fail-closed.\n\n## Mutações e Git\n\nSiga `observe -> plan -> validate -> apply -> readback`. Use as superfícies canônicas do domínio; não construa writers ad hoc. PlanHash/CAS/readback exigidos por uma transição são parte da autorização, não burocracia opcional.\n\nBranch names não concedem proteção nem autorização de deleção. Sanitização deve derivar de ProjectState e evidência Git/PR corrente. Operações destrutivas são aceitáveis quando o contrato e a autorização as suportam; conservadorismo nominal não substitui evidência.\n\n## Scheduled workers e durabilidade\n\nCada execução reobserva authorities necessárias; conversa anterior é contexto local, não prova de estado. Trabalho relevante não deve terminar apenas no working tree/runtime. Persista código/checkpoints/leases/work somente nas authorities apropriadas e com readback. Não crie commits narrativos apenas porque o relógio da task terminou.\n\n## Peer Recovery shadow\n\nA capability `peer-recovery`, quando `policy=experimental` e `supervisorParticipation=isolated`, permanece um protocolo read-only/shadow e não altera Maintenance ou SchedulerPlan.\n\n- `worker.health` e `peer.recovery` no Agent Bus são evidência de transporte, não authority.\n- Heads recebidos por email devem ser reobservados no Git antes de comparação.\n- Reprodução é read-only e limitada à superfície declarada.\n- Mesmo-head + falha do peer + reprodução local PASS pode classificar assimetria de runtime; não transfere identidade, lease, Work ou controle de task.\n- Diferent/unverifiable heads falham fechado.\n- Uma auto-recuperação bounded do caminho de download do artifact pode ser tentada por episódio; não entrar em loop A↔B.\n- Promoção da capability exige decisão explícita de lifecycle; sucesso de probes não a torna canônica automaticamente.\n\n## Handoff e saída\n\nRelatórios de execução devem ser compactos e deriváveis: authorities/heads relevantes, decisão operacional usada, mutações e readback, próximo target e blockers. Narrativa extensa não é requisito de continuidade quando o estado durável já está corretamente persistido.\n''', encoding='utf-8')

          Path('tools/tests/test_c1c_boundaries.py').write_text('''import copy\nimport unittest\nfrom pathlib import Path\n\nfrom tools import coordination, prune_plan, scheduler_snapshot\nfrom tools.tests.test_scheduler_snapshot import pipeline\n\nROOT = Path(__file__).resolve().parents[2]\n\n\nclass C1CBoundaryTests(unittest.TestCase):\n    def test_snapshot_rejects_consumer_time_authority_drift(self):\n        machine, _, _, value = pipeline()\n        expected = {name: value["sourceHeads"][name]["sha"] for name in scheduler_snapshot.CURRENT_HEAD_KEYS}\n        scheduler_snapshot.validate_snapshot(\n            value, source_machine=machine, readback_machine=copy.deepcopy(machine), expected_heads=expected\n        )\n        changed = dict(expected)\n        changed["continuation"] = "9" * 40\n        with self.assertRaisesRegex(RuntimeError, "SCHEDULER_SNAPSHOT_STALE_CURRENT_CONTINUATION"):\n            scheduler_snapshot.validate_snapshot(\n                value, source_machine=machine, readback_machine=copy.deepcopy(machine), expected_heads=changed\n            )\n\n    def test_open_pr_base_is_dynamic_prune_protection(self):\n        state = {\n            "schemaVersion": "ProjectState 2.0",\n            "project": {"id": "mobilipresenter", "repository": "EAKerber/MobiliPresenter"},\n            "git": {"controlBranch": "main", "activeDevelopmentBranch": None, "protectedBranches": []},\n            "published": {"url": "x", "artifactManifest": "ops/published/viewer-next-current.json"},\n            "development": {"initiative": "I", "phase": "between-increments", "checkpoint": "C", "nextTransition": "N", "blockers": [], "prNumber": None},\n        }\n        refs = {"main": "a" * 40, "feature/base": "b" * 40, "work/head": "c" * 40}\n        prs = [{"number": 12, "state": "open", "merged": False, "headRef": "work/head", "headSha": "c" * 40, "baseRef": "feature/base"}]\n        ancestry = {name: "ancestor-of-control" for name in refs}\n        plan = prune_plan.build_prune_plan(state, refs, prs, ancestry, published_source_branch="main")\n        by = {entry["branch"]: entry for entry in plan["entries"]}\n        self.assertEqual(plan["openPrBases"], ["feature/base"])\n        self.assertIn("open-pr-base", by["feature/base"]["protections"])\n        self.assertEqual(by["feature/base"]["action"], "keep")\n\n    def test_coordination_runtime_matches_closed_schema_shape(self):\n        root = coordination.empty_state()\n        extra_root = dict(root, unexpected=True)\n        with self.assertRaisesRegex(coordination.CoordinationError, "root fields are invalid"):\n            coordination.validate_state(extra_root)\n        bad_revision = coordination.empty_state("")\n        with self.assertRaisesRegex(coordination.CoordinationError, "revision must be null or a non-empty string"):\n            coordination.validate_state(bad_revision)\n        owner = {"role": "ui", "session": "s", "branch": None, "pr": None, "unexpected": True}\n        with self.assertRaisesRegex(coordination.CoordinationError, "owner fields are invalid"):\n            coordination.validate_owner(owner)\n\n    def test_current_bootstrap_has_no_retired_operational_surfaces_or_delta_chain(self):\n        agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8")\n        current = (ROOT / "docs/kickstarts/roles/manager-gitops-current.md").read_text(encoding="utf-8")\n        v05 = (ROOT / "docs/kickstarts/roles/manager-gitops-v0.5.md").read_text(encoding="utf-8")\n        combined = agents + "\\n" + current + "\\n" + v05\n        for retired in ("maintenance_live.py", "scheduler_plan.py --live", "maintenance_inspect.py --remote"):\n            self.assertNotIn(retired, combined)\n        self.assertIn("manager-gitops-v0.5.md", current)\n        self.assertNotIn("manager-gitops-v0.4.md", current)\n        self.assertNotIn("manager-gitops-v0.3.md", current)\n        self.assertNotIn("importa normativamente versões anteriores", v05.lower())\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Validate candidate
        run: |
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          python -m tools.semantics check --json
          python tools/agent.py verify --json
      - name: Publish candidate on work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md tools docs/kickstarts/roles
          git commit -m 'C1C: close runtime boundaries and slim bootstrap [c1c-applied]'
          git push origin HEAD:work/operations/operational-boundary-cleanup-c1c
