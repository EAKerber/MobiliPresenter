name: Module Thumbnails

on:
  pull_request:
    paths:
      - "viewer-next/thumbnail.html"
      - "viewer-next/src/thumbnail.ts"
      - "viewer-next/tests/module_thumbnail_capture.mjs"
      - ".github/workflows/module-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Scene Core toolchain
        working-directory: scene-core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Viewer Next toolchain
        working-directory: viewer-next
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck thumbnail entry
        working-directory: viewer-next
        run: |
          npm run build:core
          npx tsc -p tsconfig.json

      - name: Start Vite thumbnail host
        working-directory: viewer-next
        run: |
          npx vite --host 127.0.0.1 --port 4174 > /tmp/module-thumbnail-vite.log 2>&1 &
          echo $! > /tmp/module-thumbnail-vite.pid
          for i in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4174/thumbnail.html?module=01" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/module-thumbnail-vite.log
          exit 1

      - name: Capture transparent module thumbnails
        working-directory: viewer-next
        run: node tests/module_thumbnail_capture.mjs http://127.0.0.1:4174/

      - name: Materialize deploy assets
        if: success()
        run: |
          mkdir -p viewer-next/public/module-thumbnails
          cp viewer-next/artifacts/module-thumbnails/module-*.png viewer-next/public/module-thumbnails/

      - name: Commit generated thumbnails to PR branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer-next/public/module-thumbnails/module-*.png
          if git diff --cached --quiet; then
            echo "Generated thumbnails already match the branch assets."
            exit 0
          fi
          git commit -m "chore(ui): refresh generated module thumbnails"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload module thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-thumbnails
          path: viewer-next/artifacts/module-thumbnails/
          if-no-files-found: warn
          retention-days: 14
