name: Viewer Next

on:
  push:
    branches:
      - "renderer/**"
    paths:
      - "viewer-next/**"
      - "scene-core/**"
      - "fidelity/**"
      - ".github/workflows/viewer-next.yml"
  pull_request:
    paths:
      - "viewer-next/**"
      - "scene-core/**"
      - "fidelity/**"
      - ".github/workflows/viewer-next.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Scene Core toolchain
        working-directory: scene-core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Viewer Next toolchain
        working-directory: viewer-next
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Viewer Next
        working-directory: viewer-next
        run: npm run verify

      - name: Generate readability probe specification
        working-directory: scene-core
        run: |
          npm run build
          node tools/fidelity-readability-spec.mjs /tmp/mobilipresenter-readability-spec.json
          python -m json.tool /tmp/mobilipresenter-readability-spec.json > /dev/null

      - name: Start Viewer Next preview
        working-directory: viewer-next
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mobilipresenter-viewer-next.log 2>&1 &
          echo $! > /tmp/mobilipresenter-viewer-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mobilipresenter-viewer-next.log
          exit 1

      - name: Browser WebGL baseline
        working-directory: viewer-next
        run: python3 tests/browser_smoke.py

      - name: Browser fidelity overlay
        working-directory: viewer-next
        run: python3 tests/fidelity_smoke.py

      - name: Capture targeted 4x readability crops
        working-directory: viewer-next
        run: |
          python3 tests/readability_capture.py \
            /tmp/mobilipresenter-readability-spec.json \
            /tmp/mobilipresenter-readability-crops \
            /tmp/mobilipresenter-readability-crops.json
          python -m json.tool /tmp/mobilipresenter-readability-crops.json > /dev/null

      - name: Measure semantic seam readability
        working-directory: viewer-next
        run: |
          python3 tests/readability_analyze.py \
            /tmp/mobilipresenter-readability-spec.json \
            /tmp/mobilipresenter-readability-crops.json \
            /tmp/mobilipresenter-readability-crops \
            /tmp/mobilipresenter-readability-report.json
          python -m json.tool /tmp/mobilipresenter-readability-report.json > /dev/null

      - name: Compare readability against FH-06.1 S1 baseline
        working-directory: viewer-next
        run: |
          python3 tests/readability_compare.py \
            ../fidelity/baselines/fh06-1-readability.json \
            /tmp/mobilipresenter-readability-report.json \
            /tmp/mobilipresenter-readability-comparison.json
          python -m json.tool /tmp/mobilipresenter-readability-comparison.json > /dev/null

      - name: Stage visual evidence
        if: always()
        run: |
          mkdir -p viewer-next/artifacts viewer-next/fidelity-artifacts
          if [ -f /tmp/mobilipresenter-viewer.png ]; then
            cp /tmp/mobilipresenter-viewer.png viewer-next/artifacts/renderer-baseline.png
          fi
          if [ -f /tmp/mobilipresenter-browser-evidence.json ]; then
            cp /tmp/mobilipresenter-browser-evidence.json viewer-next/artifacts/browser-evidence.json
          fi
          if [ -f /tmp/mobilipresenter-viewer-dom.html ]; then
            cp /tmp/mobilipresenter-viewer-dom.html viewer-next/artifacts/renderer-dom.html
          fi
          if [ -f /tmp/mobilipresenter-viewer-next.log ]; then
            cp /tmp/mobilipresenter-viewer-next.log viewer-next/artifacts/preview.log
            cp /tmp/mobilipresenter-viewer-next.log viewer-next/fidelity-artifacts/preview.log
          fi
          if [ -f /tmp/mobilipresenter-fidelity-overlay-1x.png ]; then
            cp /tmp/mobilipresenter-fidelity-overlay-1x.png viewer-next/fidelity-artifacts/fidelity-overlay-1x.png
          fi
          if [ -f /tmp/mobilipresenter-fidelity-evidence.json ]; then
            cp /tmp/mobilipresenter-fidelity-evidence.json viewer-next/fidelity-artifacts/fidelity-evidence.json
          fi
          if [ -f /tmp/mobilipresenter-fidelity-dom.html ]; then
            cp /tmp/mobilipresenter-fidelity-dom.html viewer-next/fidelity-artifacts/fidelity-dom.html
          fi
          if [ -f /tmp/mobilipresenter-readability-spec.json ]; then
            cp /tmp/mobilipresenter-readability-spec.json viewer-next/fidelity-artifacts/readability-spec.json
          fi
          if [ -f /tmp/mobilipresenter-readability-crops.json ]; then
            cp /tmp/mobilipresenter-readability-crops.json viewer-next/fidelity-artifacts/readability-crops.json
          fi
          if [ -d /tmp/mobilipresenter-readability-crops ]; then
            cp -R /tmp/mobilipresenter-readability-crops viewer-next/fidelity-artifacts/readability-crops
          fi
          if [ -f /tmp/mobilipresenter-readability-report.json ]; then
            cp /tmp/mobilipresenter-readability-report.json viewer-next/fidelity-artifacts/readability-report.json
          fi
          if [ -f /tmp/mobilipresenter-readability-comparison.json ]; then
            cp /tmp/mobilipresenter-readability-comparison.json viewer-next/fidelity-artifacts/readability-comparison.json
          fi

      - name: Persist user-facing artifacts to temporary branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/renderer/fixed-view-realistic-v1' && success() }}
        env:
          ARTIFACT_BRANCH: tmp/fh06-user-artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${ARTIFACT_BRANCH}:refs/remotes/origin/${ARTIFACT_BRANCH}"
          rm -rf /tmp/mobilipresenter-user-artifacts
          git worktree add --force -B "${ARTIFACT_BRANCH}" /tmp/mobilipresenter-user-artifacts "refs/remotes/origin/${ARTIFACT_BRANCH}"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          DEST="/tmp/mobilipresenter-user-artifacts/artifacts/fh06/${SHORT_SHA}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -R viewer-next/artifacts "${DEST}/visual"
          cp -R viewer-next/fidelity-artifacts "${DEST}/fidelity"
          (
            cd "${DEST}"
            zip -q -r "fh06-${SHORT_SHA}-verified-bundle.zip" visual fidelity
          )

          SOURCE_SHA="${GITHUB_SHA}" SOURCE_BRANCH="${GITHUB_REF_NAME}" RUN_ID="${GITHUB_RUN_ID}" DEST="${DEST}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dest = Path(os.environ["DEST"])
          files = []
          for path in sorted(dest.rglob("*")):
              if not path.is_file() or path.name == "ARTIFACTS.json":
                  continue
              data = path.read_bytes()
              files.append({
                  "path": str(path.relative_to(dest)).replace("\\", "/"),
                  "sizeBytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "schemaVersion": "MobiliPresenterUserArtifactManifest 1.0",
              "status": "verified-ci-artifact",
              "source": {
                  "branch": os.environ["SOURCE_BRANCH"],
                  "commit": os.environ["SOURCE_SHA"],
                  "workflowRunId": int(os.environ["RUN_ID"]),
              },
              "files": files,
          }
          (dest / "ARTIFACTS.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          SHORT_SHA="${SHORT_SHA}" SOURCE_SHA="${GITHUB_SHA}" RUN_ID="${GITHUB_RUN_ID}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/mobilipresenter-user-artifacts")
          short_sha = os.environ["SHORT_SHA"]
          latest = {
              "schemaVersion": "MobiliPresenterArtifactPointer 1.0",
              "sourceCommit": os.environ["SOURCE_SHA"],
              "sourceShortSha": short_sha,
              "workflowRunId": int(os.environ["RUN_ID"]),
              "path": f"artifacts/fh06/{short_sha}",
              "manifest": f"artifacts/fh06/{short_sha}/ARTIFACTS.json",
              "bundle": f"artifacts/fh06/{short_sha}/fh06-{short_sha}-verified-bundle.zip",
              "preview": f"artifacts/fh06/{short_sha}/visual/renderer-baseline.png",
          }
          (root / "LATEST.json").write_text(
              json.dumps(latest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          cd /tmp/mobilipresenter-user-artifacts
          git add ARTIFACTS-README.md LATEST.json artifacts/fh06
          if git diff --cached --quiet; then
            echo "Artifact branch already contains this verified set."
            exit 0
          fi
          git commit -m "artifacts — persistir FH-06 ${SHORT_SHA}"
          git push origin "HEAD:refs/heads/${ARTIFACT_BRANCH}"

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-next-visual-baseline
          path: viewer-next/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-next-fidelity-overlay
          path: viewer-next/fidelity-artifacts/
          if-no-files-found: warn
          retention-days: 14

  ci-status:
    needs: verify
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/renderer/fixed-view-realistic-v1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/fh06-user-artifacts
          fetch-depth: 1

      - name: Persist Viewer Next run status
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": "MobiliPresenterCiStatus 1.0",
              "workflow": "Viewer Next",
              "sourceCommit": os.environ["SOURCE_SHA"],
              "sourceBranch": os.environ["SOURCE_BRANCH"],
              "workflowRunId": int(os.environ["RUN_ID"]),
              "workflowRunAttempt": int(os.environ["RUN_ATTEMPT"]),
              "verifyResult": os.environ["VERIFY_RESULT"],
          }
          Path("CI-LATEST.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI-LATEST.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci — registrar Viewer Next ${SOURCE_SHA:0:7} ${VERIFY_RESULT}"
          git push origin HEAD:refs/heads/tmp/fh06-user-artifacts
