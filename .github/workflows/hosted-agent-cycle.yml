name: Hosted Agent Cycle

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  cycle:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'MobiliPresenter Remote Canonical Execution Bus' &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_1') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_2') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_3') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_4'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosted-cycle carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse closed hosted-cycle request
        id: parse
        continue-on-error: true
        run: |
          python tools/hosted_agent_cycle.py parse-event \
            --event "$GITHUB_EVENT_PATH" \
            --command-out /tmp/hosted-command.json \
            --meta-out /tmp/hosted-meta.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Materialize parse failure
        if: steps.parse.outcome != 'success'
        run: |
          python tools/hosted_agent_cycle.py failure \
            --error HOSTED_AGENT_PARSE_FAILED \
            --phase PARSE \
            --result /tmp/hosted-result.json

      - name: Run canonical begin
        id: begin
        if: steps.parse.outcome == 'success' && steps.parse.outputs.action == 'begin'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/agent-cycle-begin
          python tools/hosted_agent_cycle.py begin \
            --command /tmp/hosted-command.json \
            --meta /tmp/hosted-meta.json \
            --context /tmp/agent-cycle-begin/context.json \
            --manifest /tmp/agent-cycle-begin/manifest.json \
            --result /tmp/hosted-result.json

      - name: Upload begin context
        id: begin_artifact
        if: steps.begin.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-cycle-begin-${{ github.run_id }}
          path: /tmp/agent-cycle-begin
          if-no-files-found: error
          retention-days: 14

      - name: Fail begin if artifact was not preserved
        if: steps.begin.outcome == 'success' && steps.begin_artifact.outcome != 'success'
        run: |
          python tools/hosted_agent_cycle.py failure \
            --error HOSTED_AGENT_BEGIN_ARTIFACT_UPLOAD_FAILED \
            --phase TRANSPORT \
            --command /tmp/hosted-command.json \
            --result /tmp/hosted-result.json

      - name: Qualify begin artifact resumability
        id: begin_resumability
        if: steps.begin.outcome == 'success' && steps.begin_artifact.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from tools import hosted_cycle_artifact
          ok = hosted_cycle_artifact.qualify_begin_files(
              repository=os.environ['GITHUB_REPOSITORY'],
              command_path='/tmp/hosted-command.json',
              manifest_path='/tmp/agent-cycle-begin/manifest.json',
              result_path='/tmp/hosted-result.json',
              observation_path='/tmp/hosted-begin-resumability.json',
          )
          raise SystemExit(0 if ok else 2)
          PY

      - name: Fail begin if resumability was not materialized
        if: >-
          steps.begin.outcome == 'success' &&
          steps.begin_artifact.outcome == 'success' &&
          steps.begin_resumability.outcome != 'success'
        run: |
          if python - <<'PY'
          import json
          try:
              value=json.load(open('/tmp/hosted-result.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(2)
          raise SystemExit(0 if value.get('schemaVersion') == 'HostedAgentCycleFailure 0.2' else 2)
          PY
          then
            exit 0
          fi
          python tools/hosted_agent_cycle.py failure \
            --error HOSTED_AGENT_BEGIN_ARTIFACT_OBSERVATION_UNKNOWN \
            --phase TRANSPORT \
            --command /tmp/hosted-command.json \
            --result /tmp/hosted-result.json

      - name: Derive hosted quiescence sample
        id: hosted_quiescence
        if: >-
          steps.begin.outcome == 'success' &&
          steps.begin_artifact.outcome == 'success' &&
          steps.begin_resumability.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hosted-quiescence
          python - <<'PY'
          import os
          from tools import hosted_quiescence_sampling
          raise SystemExit(hosted_quiescence_sampling.materialize_from_files(
              context_path='/tmp/agent-cycle-begin/context.json',
              observation_id=f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}",
              sequence=int(os.environ['GITHUB_RUN_NUMBER']),
              output_dir='/tmp/hosted-quiescence',
          ))
          PY

      - name: Upload hosted quiescence evidence
        if: steps.hosted_quiescence.outcome == 'success' || steps.hosted_quiescence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hosted-quiescence-${{ github.run_id }}
          path: /tmp/hosted-quiescence
          if-no-files-found: error
          retention-days: 14

      - name: Observe exact begin artifact
        id: observe_begin
        if: steps.parse.outcome == 'success' && steps.parse.outputs.action == 'close'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEGIN_RUN_ID: ${{ steps.parse.outputs.begin_run_id }}
          BEGIN_SOURCE_SHA: ${{ steps.parse.outputs.begin_source_sha }}
        run: |
          python - <<'PY'
          import os
          from tools import hosted_cycle_artifact
          ok = hosted_cycle_artifact.qualify_close_files(
              repository=os.environ['GITHUB_REPOSITORY'],
              command_path='/tmp/hosted-command.json',
              run_id=int(os.environ['BEGIN_RUN_ID']),
              source_sha=os.environ['BEGIN_SOURCE_SHA'],
              result_path='/tmp/hosted-result.json',
              observation_path='/tmp/hosted-close-resumability.json',
          )
          raise SystemExit(0 if ok else 2)
          PY

      - name: Download exact begin context
        id: download_begin
        if: steps.observe_begin.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-cycle-begin-${{ steps.parse.outputs.begin_run_id }}
          path: /tmp/agent-cycle-begin
          github-token: ${{ github.token }}
          run-id: ${{ steps.parse.outputs.begin_run_id }}

      - name: Reobserve begin artifact after download failure
        id: reobserve_begin
        if: steps.observe_begin.outcome == 'success' && steps.download_begin.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEGIN_RUN_ID: ${{ steps.parse.outputs.begin_run_id }}
          BEGIN_SOURCE_SHA: ${{ steps.parse.outputs.begin_source_sha }}
        run: |
          python - <<'PY'
          import os
          from tools import hosted_cycle_artifact
          hosted_cycle_artifact.qualify_close_files(
              repository=os.environ['GITHUB_REPOSITORY'],
              command_path='/tmp/hosted-command.json',
              run_id=int(os.environ['BEGIN_RUN_ID']),
              source_sha=os.environ['BEGIN_SOURCE_SHA'],
              result_path='/tmp/hosted-result.json',
              observation_path='/tmp/hosted-close-resumability-reobserve.json',
              download_failed=True,
          )
          raise SystemExit(2)
          PY

      - name: Checkout exact begin semantic host
        id: checkout_begin
        if: steps.download_begin.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.parse.outputs.begin_source_sha }}

      - name: Materialize close carrier fallback
        if: >-
          steps.parse.outcome == 'success' &&
          steps.parse.outputs.action == 'close' &&
          (steps.observe_begin.outcome != 'success' ||
           steps.download_begin.outcome != 'success' ||
           steps.checkout_begin.outcome != 'success')
        run: |
          if [ -f /tmp/hosted-result.json ]; then
            exit 0
          fi
          python tools/hosted_agent_cycle.py failure \
            --error HOSTED_AGENT_BEGIN_ARTIFACT_UNAVAILABLE \
            --phase TRANSPORT \
            --command /tmp/hosted-command.json \
            --result /tmp/hosted-result.json

      - name: Run canonical close once
        id: close
        if: steps.checkout_begin.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_AGENT_SOURCE_SHA: ${{ steps.parse.outputs.begin_source_sha }}
        run: |
          mkdir -p /tmp/hosted-evidence /tmp/agent-cycle-close
          python tools/hosted_agent_cycle.py close \
            --command /tmp/hosted-command.json \
            --meta /tmp/hosted-meta.json \
            --begin-dir /tmp/agent-cycle-begin \
            --closure /tmp/agent-cycle-close/closure.json \
            --evidence-dir /tmp/hosted-evidence \
            --result /tmp/hosted-result.json
          cp /tmp/hosted-result.json /tmp/agent-cycle-close/result.json

      - name: Qualify observational close compatibility recovery
        id: close_recovery_eligibility
        if: steps.checkout_begin.outcome == 'success' && steps.close.outcome != 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          try:
              value = json.loads(
                  Path('/tmp/hosted-result.json').read_text(encoding='utf-8')
              )
          except (OSError, json.JSONDecodeError):
              raise SystemExit(2)

          cause = {
              'code': 'HOSTED_CYCLE_RECORD_LEASE_REQUEST_INVALID',
              'source': 'hosted-agent-cycle-trace',
              'phase': 'CLOSE',
          }
          core = value.get('failureCore') if isinstance(value, dict) else None
          recovery = core.get('recovery') if isinstance(core, dict) else None
          eligible = (
              isinstance(value, dict)
              and value.get('schemaVersion') == 'HostedAgentCycleFailure 0.2'
              and value.get('status') in {'BLOCKED', 'UNKNOWN'}
              and isinstance(core, dict)
              and core.get('schemaVersion') == 'AgentFailureCore 0.1'
              and core.get('surface') == 'AGENT_CYCLE'
              and core.get('phase') == 'CLOSE'
              and core.get('status') in {'BLOCKED', 'UNKNOWN'}
              and core.get('causes') == [cause]
              and isinstance(recovery, dict)
              and recovery.get('observationRetry') == 'UNKNOWN'
              and recovery.get('operationReplay') == 'NOT_APPLICABLE'
              and core.get('mutationState') == 'NOT_APPLICABLE'
              and core.get('lossyProjection') is False
              and core.get('readOnly') is True
              and core.get('semanticAuthority') is False
              and core.get('authorizesMutation') is False
          )
          raise SystemExit(0 if eligible else 2)
          PY
          cp /tmp/hosted-result.json /tmp/hosted-close-compatibility-failure.json

      - name: Restore current hosted-cycle carrier for compatible close observation
        id: checkout_close_recovery
        if: steps.close_recovery_eligibility.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Run canonical close compatibility recovery
        id: close_recovery
        if: steps.checkout_close_recovery.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_AGENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          rm -rf /tmp/hosted-evidence /tmp/agent-cycle-close
          mkdir -p /tmp/hosted-evidence /tmp/agent-cycle-close
          cp /tmp/hosted-close-compatibility-failure.json \
            /tmp/agent-cycle-close/compatibility-recovery-source.json
          python tools/hosted_agent_cycle.py close \
            --command /tmp/hosted-command.json \
            --meta /tmp/hosted-meta.json \
            --begin-dir /tmp/agent-cycle-begin \
            --closure /tmp/agent-cycle-close/closure.json \
            --evidence-dir /tmp/hosted-evidence \
            --result /tmp/hosted-result.json
          cp /tmp/hosted-result.json /tmp/agent-cycle-close/result.json

      - name: Materialize close termination review shadow
        if: steps.close.outcome == 'success' || steps.close_recovery.outcome == 'success'
        run: |
          args=(
            close-review
            --context /tmp/agent-cycle-begin/context.json
            --manifest /tmp/agent-cycle-begin/manifest.json
            --closure /tmp/agent-cycle-close/closure.json
            --resources /tmp/agent-cycle-close/agent-cycle-touched-resources.json
            --inventory /tmp/agent-cycle-close/agent-cycle-obligation-inventory.json
            --dispositions /tmp/agent-cycle-close/agent-cycle-obligation-dispositions.json
            --output /tmp/agent-cycle-close/close-review.json
            --json
          )
          for path in /tmp/hosted-evidence/evidence-*.json; do
            if [ -e "$path" ]; then
              args+=(--evidence "$path")
            fi
          done
          if ! python tools/agent.py "${args[@]}"; then
            python - <<'PY'
          import json
          from pathlib import Path
          value = {
              "schemaVersion": "AgentCycleCloseReviewShadowDiagnostic 0.1",
              "status": "UNKNOWN",
              "reasonCode": "AGENT_CYCLE_CLOSE_REVIEW_MATERIALIZATION_FAILED",
              "readOnly": True,
              "semanticAuthority": False,
              "authorizesMutation": False,
          }
          Path('/tmp/agent-cycle-close/close-review.error.json').write_text(
              json.dumps(value, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Promote observational close gap
        if: >-
          steps.checkout_begin.outcome == 'success' &&
          steps.close.outcome != 'success' &&
          steps.close_recovery.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from tools import hosted_agent_cycle_waiting
          hosted_agent_cycle_waiting.promote_close_result(
              command_path='/tmp/hosted-command.json',
              meta_path='/tmp/hosted-meta.json',
              begin_dir='/tmp/agent-cycle-begin',
              closure_path='/tmp/agent-cycle-close/closure.json',
              result_path='/tmp/hosted-result.json',
          )
          PY

      - name: Upload close proof
        id: close_artifact
        if: steps.close.outcome == 'success' || steps.close_recovery.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-cycle-close-${{ github.run_id }}
          path: /tmp/agent-cycle-close
          if-no-files-found: error
          retention-days: 14

      - name: Fail close if proof was not preserved
        if: >-
          (steps.close.outcome == 'success' || steps.close_recovery.outcome == 'success') &&
          steps.close_artifact.outcome != 'success'
        env:
          HOSTED_AGENT_SOURCE_SHA: ${{ steps.close_recovery.outcome == 'success' && github.sha || steps.parse.outputs.begin_source_sha }}
        run: |
          python tools/hosted_agent_cycle.py failure \
            --error HOSTED_AGENT_CLOSE_ARTIFACT_UPLOAD_FAILED \
            --phase TRANSPORT \
            --command /tmp/hosted-command.json \
            --result /tmp/hosted-result.json

      - name: Post compact hosted-cycle result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f /tmp/hosted-result.json ]; then
            exit 0
          fi
          BODY="$(cat /tmp/hosted-result.json)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="MOBILIPRESENTER_AGENT_CYCLE_RESULT_V0_1
          ${BODY}"

      - name: Require operational result
        if: always()
        run: |
          test -f /tmp/hosted-result.json
          python - <<'PY'
          from tools import hosted_agent_cycle_waiting
          hosted_agent_cycle_waiting.require_operational_result('/tmp/hosted-result.json')
          PY
