name: Hosted ProjectState Checkpoint

on:
  issue_comment:
    types: [created]

concurrency:
  group: hosted-project-state-checkpoint-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  checkpoint:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'MobiliPresenter Remote Canonical Execution Bus' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'MOBILIPRESENTER_PROJECT_STATE_CHECKPOINT_REQUEST_V0_1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical host
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve target work branch
        id: target
        run: |
          set -euo pipefail
          branch=$(python tools/hosted_project_state_checkpoint.py branch --event "$GITHUB_EVENT_PATH")
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target branch
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git switch -c "${TARGET_BRANCH}" --track "origin/${TARGET_BRANCH}"

      - name: Execute canonical ProjectState writer
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/hosted_project_state_checkpoint.py execute \
            --event "$GITHUB_EVENT_PATH" \
            --output /tmp/project-state-checkpoint-result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish result
        if: always() && steps.execute.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result_path = Path('/tmp/project-state-checkpoint-result.json')
          if not result_path.is_file():
              result = {
                  'schemaVersion': 'HostedProjectStateCheckpointResult 0.1',
                  'requestId': None,
                  'status': 'BLOCKED',
                  'blockers': ['PROJECT_STATE_CHECKPOINT_RESULT_MISSING'],
                  'detail': 'canonical writer did not materialize a result',
                  'semanticAuthority': False,
                  'authorizesMutation': False,
              }
          else:
              result = json.loads(result_path.read_text(encoding='utf-8'))
          body = (
              'MOBILIPRESENTER_PROJECT_STATE_CHECKPOINT_RESULT_V0_1\n'
              '```json\n'
              + json.dumps(result, indent=2, ensure_ascii=False)
              + '\n```'
          )
          Path('/tmp/project-state-checkpoint-comment.json').write_text(
              json.dumps({'body': body}, ensure_ascii=False),
              encoding='utf-8',
          )
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --input /tmp/project-state-checkpoint-comment.json

      - name: Preserve checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-project-state-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/project-state-checkpoint-result.json
            /tmp/project-state-checkpoint-comment.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed on blocked checkpoint
        if: always()
        run: test "${{ steps.execute.outputs.exit_code }}" = "0"
