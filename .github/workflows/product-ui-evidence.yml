name: Product UI Evidence

on:
  pull_request:
    paths:
      - "viewer-next/src/ui/**"
      - "viewer-next/src/bootstrap.ts"
      - "viewer-next/src/renderer/three/selection.ts"
      - "viewer-next/src/renderer/three/environment-realism.ts"
      - "viewer-next/src/renderer/three/materials.ts"
      - "viewer-next/src/renderer/three/wall-tiles.ts"
      - "viewer-next/src/runtime/composition.ts"
      - "viewer-next/tests/environment-realism.test.mjs"
      - "viewer-next/tests/surface-fidelity.test.mjs"
      - "viewer-next/public/module-thumbnails/**"
      - "viewer-next/tests/chrome_viewport_capture.mjs"
      - ".github/workflows/product-ui-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Scene Core toolchain
        working-directory: scene-core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Viewer Next toolchain
        working-directory: viewer-next
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build product UI
        working-directory: viewer-next
        env:
          VITE_DEFAULT_UI_MODE: product
        run: npm run build

      - name: Start product preview
        working-directory: viewer-next
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/product-ui-preview.log 2>&1 &
          echo $! > /tmp/product-ui-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/product-ui-preview.log
          exit 1

      - name: Capture responsive product UI
        working-directory: viewer-next
        run: python3 tests/runtime_ui_smoke.py

      - name: Exercise product stage navigation
        working-directory: viewer-next
        run: |
          mkdir -p artifacts/product-ui-navigation
          for step in finishes accessories summary; do
            node tests/chrome_viewport_capture.mjs \
              --url "http://127.0.0.1:4173/?controls=1" \
              --name "navigation-${step}" \
              --width 1366 \
              --height 768 \
              --out-dir artifacts/product-ui-navigation \
              --no-screenshot \
              --click-selector "[data-configurator-step=\"${step}\"]" \
              --wait-selector "[data-stage-panel=\"${step}\"]" \
              --expect-step "${step}"
          done

      - name: Capture opt-in environment realism
        working-directory: viewer-next
        run: |
          mkdir -p artifacts/environment-realism
          node tests/chrome_viewport_capture.mjs \
            --url "http://127.0.0.1:4173/?controls=1&realism=1" \
            --name "environment-realism-1366x768" \
            --width 1366 \
            --height 768 \
            --out-dir artifacts/environment-realism

      - name: Capture Surface Fidelity warm wood
        working-directory: viewer-next
        run: |
          mkdir -p artifacts/surface-fidelity
          node tests/chrome_viewport_capture.mjs \
            --url "http://127.0.0.1:4173/?controls=1&realism=1&front=03%3Awarm-wood" \
            --name "surface-fidelity-wood-1366x768" \
            --width 1366 \
            --height 768 \
            --out-dir artifacts/surface-fidelity

      - name: Upload product UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-ui-evidence
          path: |
            viewer-next/artifacts/runtime-ui/
            viewer-next/artifacts/product-ui-navigation/
            viewer-next/artifacts/environment-realism/
            viewer-next/artifacts/surface-fidelity/
          if-no-files-found: warn
          retention-days: 14
