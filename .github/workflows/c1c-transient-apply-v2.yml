name: C1C transient candidate v2
on:
  push:
    branches: ['work/operations/operational-boundary-cleanup-c1c']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse exact candidate transformation and fix characterization
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/c1c-transient-apply.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          exec(compile(script, '<c1c-transformation>', 'exec'), {'__name__': '__main__'})

          path = Path('tools/tests/test_c1c_boundaries.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertNotIn("importa normativamente versões anteriores", v05.lower())\n'
          new = '        self.assertNotIn("manager-gitops-v0.4.md", v05)\n        self.assertNotIn("manager-gitops-v0.3.md", v05)\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('tools/tests/test_prune_apply.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'mock.patch.object(apply_mod, "observe_open_prs_for_branch", return_value=[{"number": 99}])': 'mock.patch.object(apply_mod, "observe_open_prs_using_branch", return_value=[{"number": 99}])',
              'with self.assertRaisesRegex(RuntimeError, "STALE_PLAN:OPEN_PR_APPEARED:old/a")': 'with self.assertRaisesRegex(RuntimeError, "STALE_PLAN:OPEN_PR_RELATION_APPEARED:old/a")',
              'mock.patch.object(apply_mod, "observe_open_prs_for_branch", return_value=[])': 'mock.patch.object(apply_mod, "observe_open_prs_using_branch", return_value=[])',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'TEST_REPLACE_MISSING:{old}')
              text = text.replace(old, new)
          marker = '    def test_allowed_stale_inventory_is_only_deleted_refs_at_exact_sha(self):\n'
          assert text.count(marker) == 1
          extra = '''    def test_open_pr_base_is_reobserved_before_delete(self):\n        with mock.patch.object(apply_mod, "observe_open_prs_for_branch", return_value=[]), \\\n             mock.patch.object(apply_mod, "gh_json", return_value=(True, [{"number": 12}])) as gh:\n            observed = apply_mod.observe_open_prs_using_branch("EAKerber/MobiliPresenter", "feature/base")\n        self.assertEqual([item["number"] for item in observed], [12])\n        self.assertIn("base=feature%2Fbase", gh.call_args.args[0])\n\n'''
          path.write_text(text.replace(marker, extra + marker), encoding='utf-8')
          PY
      - name: Validate candidate
        run: |
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          python -m tools.semantics check --json
          python tools/agent.py verify --json
      - name: Publish candidate on work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md tools docs/kickstarts/roles
          git commit -m 'C1C: close runtime boundaries and slim bootstrap [c1c-applied]'
          git push origin HEAD:work/operations/operational-boundary-cleanup-c1c
