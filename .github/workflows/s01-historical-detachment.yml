name: S0.1 Historical Detachment

on:
  push:
    branches:
      - 'work/operations/historical-detachment-0.1'
    paths:
      - '.github/workflows/s01-historical-detachment.yml'

permissions:
  contents: write

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/operations/historical-detachment-0.1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deleted historical ref remains absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/historical-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/backup/netlify-v7.0-i5-2026-08-11")
          test "${status}" = "404"

      - name: Apply exact ProjectState retirement and remove legacy paved-road residue
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          from tools import project_state
          from tools import project_state_apply
          from tools import transition_protocol as protocol

          target = 'backup/netlify-v7.0-i5-2026-08-11'
          state_path = project_state.STATE_PATH
          before = project_state.load_state()
          errors = project_state.validate_current(before)
          if errors:
              raise RuntimeError(f"STATE_SCHEMA_INVALID:{errors[0]['detail']}")
          protected = before['git']['protectedBranches']
          if target not in protected:
              print('S0.1 already applied; nothing to mutate')
              raise SystemExit(0)

          candidate = json.loads(json.dumps(before))
          candidate['git']['protectedBranches'] = [item for item in protected if item != target]
          errors = project_state.validate_current(candidate)
          if errors:
              raise RuntimeError(f"STATE_CANDIDATE_INVALID:{errors[0]['detail']}")

          plan = protocol.build_plan(
              domain='project-state',
              action='retire-protected-branch',
              subject={'kind': 'project-state', 'id': 'mobilipresenter'},
              authority={'kind': 'repository-file', 'locator': {'path': 'ops/state/project.json'}},
              before=before,
              candidate=candidate,
              intent={'branch': target, 'reason': 'historical-exported-and-ref-deleted'},
              reversibility='revertible',
          )
          protocol.require_expected_plan(plan, plan['planHash'])
          protocol.verify_before_state(plan, before)
          print('TRANSITION_PLAN=' + json.dumps(plan, sort_keys=True, separators=(',', ':')))

          previous = state_path.read_bytes()
          try:
              project_state_apply._atomic_write(state_path, candidate)
              readback = project_state.load_state()
              errors = project_state.validate_current(readback)
              if errors:
                  raise RuntimeError(f"STATE_READBACK_INVALID:{errors[0]['detail']}")
              receipt = protocol.build_receipt(plan, readback)
              protocol.validate_receipt(receipt, plan)
              print('TRANSITION_RECEIPT=' + json.dumps(receipt, sort_keys=True, separators=(',', ':')))
          except Exception:
              project_state_apply._restore_bytes(state_path, previous)
              raise

          agent = Path('tools/agent.py')
          text = agent.read_text(encoding='utf-8')
          old = 'for rel in ("AGENTS.md", "README.md", "deploy.py"):'
          new = 'for rel in ("AGENTS.md", "README.md"):'
          if old not in text:
              raise RuntimeError('AGENT_DEPLOY_REQUIREMENT_NOT_FOUND')
          agent.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          legacy = '''## Recuperação V7\n\nA antiga publicação **V7.0-I5** não é mais a publicação corrente. Ela permanece apenas como caminho explícito de rollback/recuperação, referenciado pelo manifesto atual e pelas branches de backup/archive preservadas enquanto essa política estiver vigente.\n\n`deploy.py` e `snapshot/mobile/manifest.json` pertencem a esse caminho legado de recuperação; eles não descrevem o pipeline Netlify corrente.\n\n'''
          if legacy not in text:
              raise RuntimeError('README_LEGACY_RECOVERY_SECTION_NOT_FOUND')
          readme.write_text(text.replace(legacy, '', 1), encoding='utf-8')

          Path('deploy.py').unlink()
          shutil.rmtree('snapshot')
          PY

      - name: Verify healed paved road
        run: |
          python -m unittest tools.tests.test_publication tools.tests.test_semantic_contracts tools.tests.test_agent_ops -v
          python -m tools.semantics check
          python tools/agent.py doctor --json
          python tools/agent.py verify --json

      - name: Commit exact candidate
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'MobiliPresenter Operations'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md tools/agent.py ops/state/project.json deploy.py snapshot
          git commit -m 'S0.1 detach historical V7 rollback from current operations'
          git push origin HEAD:work/operations/historical-detachment-0.1
