name: Agent Write Lease Dispatch

on:
  workflow_run:
    workflows: ["Hosted Agent Write Lease"]
    types: [completed]

concurrency:
  group: agent-write-lease-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - name: Checkout canonical lifecycle host
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download hosted lifecycle evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-write-lease-${{ github.event.workflow_run.id }}
          path: /tmp/agent-write-lease
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Inspect lifecycle dispatch and replay state
        id: protocol
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_SHA: ${{ github.event.workflow_run.head_sha }}
          HOSTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ ! -f /tmp/agent-write-lease/agent-write-lease-dispatch.json ]; then
            echo "has_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "state=NO_DISPATCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_dispatch=true" >> "$GITHUB_OUTPUT"
          python -m tools.agent_write_lifecycle_host inspect \
            --artifact-dir /tmp/agent-write-lease \
            --host-sha "$HOST_SHA" \
            --hosted-run-id "$HOSTED_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --output /tmp/agent-write-lease-inspection.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/agent-write-lease-inspection.json').read_text(encoding='utf-8'))
          state=value.get('state')
          print(f"state={state}")
          if state in {'TERMINAL_EXISTS','PRIOR_ATTEMPT_UNKNOWN'}:
              Path('/tmp/agent-write-lease-terminal.json').write_text(
                  json.dumps(value['terminal'],indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
              )
          if state == 'CLEAR':
              Path('/tmp/agent-write-lease-attempt.json').write_text(
                  json.dumps(value['attempt'],indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
              )
          PY

      - name: Materialize dispatch validation failure
        if: steps.download.outcome == 'success' && steps.protocol.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import agent_write_lifecycle as lifecycle
          request=json.load(open('/tmp/agent-write-lease/agent-write-lease-request.json',encoding='utf-8'))
          value=lifecycle.build_failure(
              request,status='BLOCKED',
              blockers=['AGENT_WRITE_LIFECYCLE_DISPATCH_HOST_VALIDATION_FAILED'],
          )
          Path('/tmp/agent-write-lease-terminal.json').write_text(
              json.dumps(value,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          PY
          echo "state=VALIDATION_BLOCKED" >> "$GITHUB_OUTPUT"

      - name: Require readable hosted evidence
        if: steps.download.outcome != 'success'
        run: exit 2

      - name: Publish replay fence before Coordination mutation
        id: attempt
        if: steps.protocol.outputs.state == 'CLEAR'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/agent-write-lease/agent-write-lease-dispatch.json',encoding='utf-8'))['source']['issueNumber'])
          PY
          )
          python - <<'PY'
          import json
          from pathlib import Path
          attempt=json.load(open('/tmp/agent-write-lease-attempt.json',encoding='utf-8'))
          body='MOBILIPRESENTER_AGENT_WRITE_LEASE_ATTEMPT_V0_1\n```json\n'+json.dumps(attempt,indent=2,ensure_ascii=False)+'\n```'
          Path('/tmp/attempt-comment.json').write_text(json.dumps({'body':body},ensure_ascii=False),encoding='utf-8')
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --input /tmp/attempt-comment.json > /tmp/attempt-response.json
          ATTEMPT_COMMENT_ID=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/attempt-response.json',encoding='utf-8'))['id'])
          PY
          )
          echo "comment_id=$ATTEMPT_COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Materialize replay-fence failure before write
        if: steps.protocol.outputs.state == 'CLEAR' && steps.attempt.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import agent_write_lifecycle as lifecycle
          request=json.load(open('/tmp/agent-write-lease/agent-write-lease-request.json',encoding='utf-8'))
          value=lifecycle.build_failure(
              request,status='BLOCKED',
              blockers=['AGENT_WRITE_LIFECYCLE_ATTEMPT_MARKER_FAILED'],
          )
          Path('/tmp/agent-write-lease-terminal.json').write_text(
              json.dumps(value,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          PY

      - name: Execute lifecycle dispatch through canonical Coordination writer
        id: execute
        if: steps.protocol.outputs.state == 'CLEAR' && steps.attempt.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_SHA: ${{ github.event.workflow_run.head_sha }}
          HOSTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python -m tools.agent_write_lifecycle_host execute \
            --artifact-dir /tmp/agent-write-lease \
            --host-sha "$HOST_SHA" \
            --hosted-run-id "$HOSTED_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt-comment-id "${{ steps.attempt.outputs.comment_id }}" \
            --output /tmp/agent-write-lease-terminal.json

      - name: Materialize execution-host failure
        if: steps.protocol.outputs.state == 'CLEAR' && steps.attempt.outcome == 'success' && steps.execute.outcome != 'success'
        run: |
          if [ -f /tmp/agent-write-lease-terminal.json ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import agent_write_lifecycle as lifecycle
          request=json.load(open('/tmp/agent-write-lease/agent-write-lease-request.json',encoding='utf-8'))
          value=lifecycle.build_failure(
              request,status='UNKNOWN',
              blockers=['AGENT_WRITE_LIFECYCLE_DISPATCH_HOST_EXECUTION_FAILED'],
          )
          Path('/tmp/agent-write-lease-terminal.json').write_text(
              json.dumps(value,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          PY

      - name: Publish terminal lifecycle result once
        if: >-
          steps.protocol.outputs.has_dispatch == 'true' &&
          steps.protocol.outputs.state != 'NO_DISPATCH' &&
          steps.protocol.outputs.state != 'TERMINAL_EXISTS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f /tmp/agent-write-lease-terminal.json
          ISSUE_NUMBER=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/agent-write-lease/agent-write-lease-dispatch.json',encoding='utf-8'))['source']['issueNumber'])
          PY
          )
          python - <<'PY'
          import json
          from pathlib import Path
          terminal=json.load(open('/tmp/agent-write-lease-terminal.json',encoding='utf-8'))
          body='MOBILIPRESENTER_AGENT_WRITE_LEASE_RESULT_V0_1\n```json\n'+json.dumps(terminal,indent=2,ensure_ascii=False)+'\n```'
          Path('/tmp/terminal-comment.json').write_text(json.dumps({'body':body},ensure_ascii=False),encoding='utf-8')
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --input /tmp/terminal-comment.json

      - name: Ensure canonical Coordination receipt evidence
        if: steps.protocol.outputs.has_dispatch == 'true' && steps.protocol.outputs.state != 'NO_DISPATCH'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/agent-write-lease-terminal.json ]; then exit 0; fi
          ISSUE_NUMBER=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/agent-write-lease/agent-write-lease-dispatch.json',encoding='utf-8'))['source']['issueNumber'])
          PY
          )
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > /tmp/comments.json
          python - <<'PY'
          import json
          from pathlib import Path
          terminal=json.load(open('/tmp/agent-write-lease-terminal.json',encoding='utf-8'))
          receipt=terminal.get('remoteReceipt') if isinstance(terminal,dict) else None
          if terminal.get('status') != 'PASS' or not isinstance(receipt,dict):
              raise SystemExit(0)
          pages=json.load(open('/tmp/comments.json',encoding='utf-8'))
          comments=[]
          for page in pages:
              if isinstance(page,list): comments.extend(page)
              elif isinstance(page,dict): comments.append(page)
          marker='MOBILIPRESENTER_REMOTE_CANONICAL_RESULT_V0_1\n'
          for comment in comments:
              body=comment.get('body') if isinstance(comment,dict) else None
              if not isinstance(body,str) or not body.startswith(marker): continue
              raw=body[len(marker):].strip()
              if raw.startswith('```json') and raw.endswith('```'):
                  raw=raw[len('```json'):-len('```')].strip()
              try: existing=json.loads(raw)
              except json.JSONDecodeError: continue
              if existing.get('receiptHash') == receipt.get('receiptHash'):
                  raise SystemExit(0)
          body=marker+'```json\n'+json.dumps(receipt,indent=2,ensure_ascii=False)+'\n```'
          Path('/tmp/receipt-comment.json').write_text(json.dumps({'body':body},ensure_ascii=False),encoding='utf-8')
          PY
          if [ -f /tmp/receipt-comment.json ]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --input /tmp/receipt-comment.json
          fi

      - name: Require terminal lifecycle outcome
        if: always()
        run: |
          if [ "${{ steps.protocol.outputs.has_dispatch }}" != "true" ]; then exit 0; fi
          if [ "${{ steps.protocol.outputs.state }}" = "TERMINAL_EXISTS" ]; then exit 0; fi
          test -f /tmp/agent-write-lease-terminal.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/agent-write-lease-terminal.json',encoding='utf-8'))
          if value.get('status') != 'PASS':
              raise SystemExit(2)
          PY
