name: R5A1 Branch Patcher

on:
  push:
    branches:
      - work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1

permissions:
  contents: write

jobs:
  stage-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1
          fetch-depth: 0

      - name: Materialize non-executable staged workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/hosted-agent-cycle.yml').read_text(encoding='utf-8')
          old = """      (startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_1') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_2') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_3'))"""
          new = """      (startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_1') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_2') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_3') ||
       startsWith(github.event.comment.body, 'MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_4'))"""
          if source.count(old) != 1:
              raise SystemExit('hosted workflow marker anchor mismatch')
          target = Path('ops/staging/r5a1-hosted-agent-cycle.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit staged blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/staging/r5a1-hosted-agent-cycle.yml
          git diff --cached --check
          git commit -m "R5A1 scaffold: stage hosted workflow blob"
          git push origin HEAD:work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1
