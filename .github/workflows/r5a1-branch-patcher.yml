name: R5A1 Branch Patcher

on:
  push:
    branches:
      - work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1

permissions:
  contents: write

jobs:
  stage-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize staged workflow
        run: python tools/r5a1_stage_hosted_workflow.py

      - name: Commit staged blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/staging/r5a1-hosted-agent-cycle.yml
          git diff --cached --check
          git commit -m "R5A1 scaffold: stage hosted workflow blob"
          git push origin HEAD:work/operations/m12-at3d-r5a1-hosted-runtime-observation-ingress-v0.1
