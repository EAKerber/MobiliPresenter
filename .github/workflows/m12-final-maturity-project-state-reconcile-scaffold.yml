name: M12 Final Maturity ProjectState Reconcile Scaffold

on:
  push:
    branches:
      - work/operations/m12-final-maturity-project-state-reconcile-v0.1

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: work/operations/m12-final-maturity-project-state-reconcile-v0.1
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply canonical ProjectState transition
        run: PYTHONPATH=. python ops/staging/m12_final_maturity_project_state_reconcile.py

      - name: Validate resulting state and coverage
        run: |
          python -m json.tool ops/state/project.json > /dev/null
          python tools/roadmap_freshness.py validate --json
          git diff --check

      - name: Upload canonical transition evidence
        uses: actions/upload-artifact@v4
        with:
          name: m12-final-maturity-project-state-reconcile
          path: /tmp/m12-final-maturity-project-state-reconcile
          if-no-files-found: error
          retention-days: 30

      - name: Commit authority reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/state/project.json ops/semantics/roadmap-freshness-coverage.json
          git diff --cached --check
          git commit -m "M12: reconcile final maturity proof state"
          git push origin HEAD:work/operations/m12-final-maturity-project-state-reconcile-v0.1
