name: AT3C Registry Preview

on:
  push:
    branches:
      - work/operations/m12-at3c-agent-write-lease-lifecycle-v0.1
    paths:
      - .github/workflows/at3c-registry-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build semantic registry preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.semantics.registry import validate_registry

          path=Path('ops/semantics/registry.json')
          r=json.loads(path.read_text(encoding='utf-8'))

          concepts={
            'artifact.agent-write-lease-binding': {'term':'AgentWriteLeaseBinding','kind':'artifact','owner':'coordination','definition':'Hash-bound non-authoritative binding of one hosted Agent Cycle to the exact Coordination lease materialized by a canonical lifecycle transition.'},
            'artifact.agent-write-lease-close-report': {'term':'AgentWriteLeaseCloseReport','kind':'artifact','owner':'coordination','definition':'Read-only close-time projection classifying a cycle write lease lifecycle as NONE, ACTIVE, RELEASED, EXPIRED, or UNKNOWN without mutating Coordination.'},
            'artifact.agent-write-lease-dispatch': {'term':'AgentWriteLeaseDispatch','kind':'artifact','owner':'coordination','definition':'Hash-bound non-authoritative dispatch that binds an acquire, renew, or release request to an exact hosted cycle and expected Coordination/Git heads.'},
            'artifact.agent-write-lifecycle-guard-proof': {'term':'AgentWriteLifecycleGuardProof','kind':'artifact','owner':'coordination','definition':'Read-only proof that an Agent Tool mutation is bound to an ACTIVE non-expired lease result from the same hosted cycle and current Coordination authority.'},
          }
          r['concepts'].update(concepts)
          r['concepts']=dict(sorted(r['concepts'].items()))

          r['contracts'].update({
            'agent-write-lease-binding': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle.validate_binding','structuralSchema':'ops/schemas/agent-write-lease-binding.schema.json'},
            'agent-write-lease-close-report': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle_guard.validate_report','structuralSchema':'ops/schemas/agent-write-lease-close-report.schema.json'},
            'agent-write-lease-dispatch': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle.validate_dispatch','structuralSchema':'ops/schemas/agent-write-lease-dispatch.schema.json'},
            'agent-write-lease-request': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle.validate_request','structuralSchema':'ops/schemas/agent-write-lease-request.schema.json'},
            'agent-write-lease-result': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle.validate_result','structuralSchema':'ops/schemas/agent-write-lease-result.schema.json'},
            'agent-write-lifecycle-guard-proof': {'owner':'coordination','semanticValidator':'tools.agent_write_lifecycle_guard.validate_active_binding_proof','structuralSchema':'ops/schemas/agent-write-lifecycle-guard-proof.schema.json'},
          })
          r['contracts']=dict(sorted(r['contracts'].items()))

          r['components'].update({
            'agent-write-lifecycle-guard': {
              'module':'tools.agent_write_lifecycle_guard','owner':'coordination','kind':'inspection','sideEffects':False,
              'readsAuthorities':['coordination-leases'],'writesAuthorities':[], 'readsResources':[], 'writesResources':[],
              'produces':['artifact.agent-write-lease-close-report','artifact.agent-write-lifecycle-guard-proof'],
              'canonicalWriterFor':[], 'delegatesTo':[]
            },
            'agent-write-lifecycle-host-cli': {
              'module':'tools.agent_write_lifecycle_host','owner':'operations-core','kind':'cli-adapter','sideEffects':True,
              'readsAuthorities':['coordination-leases'],'writesAuthorities':[], 'readsResources':[], 'writesResources':[],
              'produces':['artifact.agent-write-lease-binding'], 'canonicalWriterFor':[], 'delegatesTo':['coordination-executor']
            },
            'hosted-agent-write-lease-cli': {
              'module':'tools.hosted_agent_write_lease','owner':'operations-core','kind':'cli-adapter','sideEffects':False,
              'readsAuthorities':['coordination-leases'],'writesAuthorities':[], 'readsResources':['git-branch-refs'], 'writesResources':[],
              'produces':['artifact.agent-write-lease-dispatch'], 'canonicalWriterFor':[], 'delegatesTo':[]
            },
          })
          r['components']['hosted-agent-cycle-cli']['readsAuthorities']=['coordination-leases']
          r['components']['hosted-agent-cycle-cli']['produces']=['artifact.agent-write-lease-close-report']
          r['components']['hosted-agent-cycle-cli']['delegatesTo']=sorted(set(r['components']['hosted-agent-cycle-cli']['delegatesTo']+['agent-write-lifecycle-guard']))
          r['components']['hosted-agent-tool-cli']['readsAuthorities']=['coordination-leases']
          r['components']['hosted-agent-tool-cli']['produces']=sorted(set(r['components']['hosted-agent-tool-cli']['produces']+['artifact.agent-tool-guard-proof-set','artifact.agent-tool-mutation-dispatch']))
          r['components']['hosted-agent-tool-cli']['delegatesTo']=sorted(set(r['components']['hosted-agent-tool-cli']['delegatesTo']+['agent-write-lifecycle-guard']))
          r['components']=dict(sorted(r['components'].items()))

          r['logicalCapabilities']['agent.write-lease.lifecycle']={
            'owner':'operations-core',
            'description':'Bind Manager Agent Tool writes to an explicit hosted-cycle Coordination lease lifecycle with exact begin identity, expected heads, canonical acquire/renew/release, replay fencing, readback, and clean-close classification.',
            'availabilityClass':'contextual',
            'facets':{
              'roles':['manager-gitops'],
              'intentClasses':['governed-mutation'],
              'lifecyclePhases':['execution','validation'],
              'operations':['authority-mutation','planning','readback','validation'],
              'objects':['artifact','branch','coordination','workflow'],
              'riskClasses':['authority-write'],
            },
            'requiredAuthorities':['coordination-leases'],
            'requiredScopes':['authority:coordination:write'],
            'preconditions':['canonical-coordination-writer','cycle-scoped-lifecycle-binding','exact-begin-artifact','replay-fence-before-mutation'],
            'providerRequirements':{},
            'toolSurfaces':['github-actions-workflows','python-module-cli'],
            'fallbackPolicy':'forbidden',
          }
          r['logicalCapabilities']['agent.cycle.hosted']['description']='Run canonical Agent Cycle begin/close on a hosted carrier with hash-bound begin artifact, exhaustive trace, and an explicit clean Agent Write Lease lifecycle gate for current manifests.'
          r['logicalCapabilities']['agent.cycle.hosted']['preconditions']=sorted(set(r['logicalCapabilities']['agent.cycle.hosted']['preconditions']+['clean-agent-write-lifecycle-on-current-manifest']))
          r['logicalCapabilities']['agent.tools.hosted']['description']='Resolve, read-only execute, or dispatch an intent-scoped Agent Tool on a hosted carrier bound to an exact Agent Cycle begin; Manager mutation execution requires lifecycle, Coordination ownership, and Git CAS proofs.'
          r['logicalCapabilities']['agent.tools.hosted']['preconditions']=sorted(set(['exact-begin-artifact','generic-agent-tool-policy','mutation-execute-requires-guard-proof-set']))
          r['logicalCapabilities']=dict(sorted(r['logicalCapabilities'].items()))

          wf=r['toolSurfaces']['github-actions-workflows']['bindings']
          wf.extend([
            {'targetKind':'workflow','target':'.github/workflows/agent-write-lease-dispatch.yml','capabilities':['agent.write-lease.lifecycle']},
            {'targetKind':'workflow','target':'.github/workflows/hosted-agent-write-lease.yml','capabilities':['agent.write-lease.lifecycle']},
          ])
          r['toolSurfaces']['github-actions-workflows']['bindings']=sorted(wf,key=lambda x:(x['targetKind'],x['target']))
          py=r['toolSurfaces']['python-module-cli']['bindings']
          py.extend([
            {'targetKind':'component','target':'agent-write-lifecycle-host-cli','capabilities':['agent.write-lease.lifecycle']},
            {'targetKind':'component','target':'hosted-agent-write-lease-cli','capabilities':['agent.write-lease.lifecycle']},
          ])
          r['toolSurfaces']['python-module-cli']['bindings']=sorted(py,key=lambda x:(x['targetKind'],x['target']))

          errors=validate_registry(r)
          if errors:
            raise SystemExit('\n'.join(errors))
          out=Path('/tmp/at3c-registry')
          out.mkdir()
          (out/'registry.json').write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Upload validated registry preview
        uses: actions/upload-artifact@v4
        with:
          name: at3c-registry-preview
          path: /tmp/at3c-registry/registry.json
          if-no-files-found: error
