name: Agent Ops
on:
  pull_request:
    paths: ['AGENTS.md','ops/**','tools/**','docs/plans/**','.github/workflows/agent-ops.yml']
  push:
    branches: ['renderer/**','architecture/**','ops/**']
    paths: ['AGENTS.md','ops/**','tools/**','docs/plans/**','.github/workflows/agent-ops.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolbox unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Verify continuation state
        run: python tools/continuation.py verify --json
      - name: Capability lifecycle guard
        if: github.event_name == 'pull_request'
        run: python tools/capability_gates_ci.py --base-sha "${{ github.event.pull_request.base.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}" --json
      - name: Doctor
        run: python tools/agent.py doctor --json
      - name: Verify local coherence
        run: python tools/agent.py verify --json
      - name: Verify remote PR identity
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/agent.py verify --remote --json
      - name: Generate maintenance inspection
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/maintenance_inspect.py --remote --json > /tmp/maintenance-inspection.json
          python -m json.tool /tmp/maintenance-inspection.json > /dev/null
      - name: Upload maintenance inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-inspection
          path: /tmp/maintenance-inspection.json
          if-no-files-found: error
      - name: Generate integration reconcile evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/integration_reconcile.py reconcile-plan "$PR_NUMBER" --json > /tmp/integration-reconcile-plan.json
          python -m json.tool /tmp/integration-reconcile-plan.json > /dev/null
      - name: Upload integration reconcile evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: integration-reconcile-plan
          path: /tmp/integration-reconcile-plan.json
          if-no-files-found: error
      - name: Generate handoff evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/agent.py handoff --json > /tmp/agent-handoff.json
          python -m json.tool /tmp/agent-handoff.json > /dev/null
      - name: Upload handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-ops-handoff
          path: /tmp/agent-handoff.json
          if-no-files-found: error

  continuation-authority-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/git-ops-continuation-state-0.1'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: mobilipresenter-continuation-authority-probe
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live continuation authority probe
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_PROBE_OUTPUT: /tmp/continuation-authority-probe.json
        run: python tools/continuation_probe.py
      - name: Validate continuation probe evidence
        run: python -m json.tool /tmp/continuation-authority-probe.json > /dev/null
      - name: Upload continuation probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: continuation-authority-probe
          path: /tmp/continuation-authority-probe.json
          if-no-files-found: error
