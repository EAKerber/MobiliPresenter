name: Agent Ops
on:
  pull_request:
    paths: ['AGENTS.md','ops/**','tools/**','docs/plans/**','docs/kickstarts/**','.github/workflows/agent-ops.yml']
  push:
    branches: ['work/**','experiment/**']
    paths: ['AGENTS.md','ops/**','tools/**','docs/plans/**','docs/kickstarts/**','.github/workflows/agent-ops.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R4A hosted delayed-result qualification
        if: github.ref_name == 'work/operations/m12-at3d-r4a-hosted-qualification-20260830'
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_AGENT_SOURCE_SHA: 7aa37ef70ca70b51bfbeb3ad3916ad6aa6a3c947
        run: |
          python - <<'PY'
          import copy
          import json
          import os
          import subprocess
          from pathlib import Path

          from tools import hosted_agent_cycle
          from tools.agent_tools import contracts, trace_collect
          from tools.canonical import stable_hash

          target = os.environ["HOSTED_AGENT_SOURCE_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{target}..HEAD"], text=True
          ).splitlines()
          if changed != [".github/workflows/agent-ops.yml"]:
              raise SystemExit(f"QUALIFICATION_DELTA_INVALID:{changed}")

          root = Path("/tmp/r4a-hosted-qualification")
          begin_root = root / "begin"
          first_root = root / "close-first"
          retry_root = root / "close-retry"
          for path in (begin_root, first_root, retry_root):
              path.mkdir(parents=True, exist_ok=True)

          actor = {
              "role": "manager-gitops",
              "workerId": "manager-gitops-a",
              "sessionId": "r4a-hosted-qualification-20260830-01",
          }
          begin_command = {
              "schemaVersion": "HostedAgentCycleCommand 0.1",
              "requestId": "r4a-hosted-begin-20260830-01",
              "action": "begin",
              "actor": actor,
              "declaredIntent": "inspect-and-plan",
              "machineScope": "live",
              "begin": None,
              "evidenceCommentIds": [],
              "semanticAuthority": False,
              "authorizesMutation": False,
          }
          begin_meta = {"issueNumber": 145, "commentId": 100}
          begin_result = hosted_agent_cycle.begin_from_envelope(
              begin_command,
              begin_meta,
              context_path=str(begin_root / "context.json"),
              manifest_path=str(begin_root / "manifest.json"),
          )
          if begin_result.get("status") != "READY":
              raise SystemExit("QUALIFICATION_BEGIN_NOT_READY")

          manifest = json.loads((begin_root / "manifest.json").read_text(encoding="utf-8"))
          begin_ref = {
              "runId": manifest["source"]["runId"],
              "sourceSha": manifest["source"]["sourceSha"],
              "contextHash": manifest["contextHash"],
          }
          request = contracts.validate_request({
              "schemaVersion": contracts.REQUEST_SCHEMA,
              "requestId": "r4a-delayed-project-inspect",
              "begin": begin_ref,
              "actor": copy.deepcopy(actor),
              "toolId": "project.inspect",
              "target": {},
              "input": {},
              "semanticAuthority": False,
              "authorizesMutation": False,
          })
          close_one = {
              "schemaVersion": "HostedAgentCycleCommand 0.2",
              "requestId": "r4a-hosted-close-one-20260830-01",
              "action": "close",
              "handle": copy.deepcopy(begin_result["handle"]),
              "evidenceCommentIds": [],
              "semanticAuthority": False,
              "authorizesMutation": False,
          }
          close_two = {
              **copy.deepcopy(close_one),
              "requestId": "r4a-hosted-close-two-20260830-01",
          }

          def owner(comment_id, marker, payload):
              return {
                  "id": comment_id,
                  "author_association": "OWNER",
                  "user": {"login": "EAKerber"},
                  "body": marker + "\n" + json.dumps(payload),
              }

          def bot(comment_id, marker, payload):
              return {
                  "id": comment_id,
                  "author_association": "NONE",
                  "user": {"login": "github-actions[bot]"},
                  "body": marker + "\n```json\n" + json.dumps(payload) + "\n```",
              }

          begin_boundary = {
              "id": 100,
              "author_association": "OWNER",
              "user": {"login": "EAKerber"},
              "body": "synthetic-r4a-begin-boundary",
          }
          request_comment = owner(
              110, trace_collect.AGENT_TOOL_REQUEST_MARKER, request
          )
          first_close_comment = owner(
              200, "MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_2", close_one
          )
          late_result = bot(
              230,
              trace_collect.AGENT_TOOL_RESULT_MARKER,
              {
                  "requestHash": stable_hash(request),
                  "begin": begin_ref,
                  "actor": copy.deepcopy(actor),
                  "status": "PASS",
                  "blockers": [],
              },
          )
          retry_close_comment = owner(
              260, "MOBILIPRESENTER_AGENT_CYCLE_REQUEST_V0_2", close_two
          )
          first_comments = [begin_boundary, request_comment, first_close_comment]
          retry_comments = [
              begin_boundary,
              request_comment,
              first_close_comment,
              late_result,
              retry_close_comment,
          ]

          original_fetch = trace_collect.fetch_issue_comments
          try:
              trace_collect.fetch_issue_comments = lambda repository, issue: copy.deepcopy(first_comments)
              first_error = None
              try:
                  hosted_agent_cycle.close_from_envelope(
                      close_one,
                      {"issueNumber": 145, "commentId": 200},
                      begin_dir=str(begin_root),
                      output_path=str(first_root / "closure.json"),
                      evidence_dir=str(first_root / "evidence"),
                  )
              except hosted_agent_cycle.HostedAgentCycleError as exc:
                  first_error = exc.code
              if first_error != "HOSTED_AGENT_EXECUTION_TRACE_INCOMPLETE":
                  raise SystemExit(f"QUALIFICATION_FIRST_CLOSE_UNEXPECTED:{first_error}")

              trace_collect.fetch_issue_comments = lambda repository, issue: copy.deepcopy(retry_comments)
              retry_result = hosted_agent_cycle.close_from_envelope(
                  close_two,
                  {"issueNumber": 145, "commentId": 260},
                  begin_dir=str(begin_root),
                  output_path=str(retry_root / "closure.json"),
                  evidence_dir=str(retry_root / "evidence"),
              )
          finally:
              trace_collect.fetch_issue_comments = original_fetch

          if retry_result.get("status") != "PASS":
              raise SystemExit("QUALIFICATION_RETRY_CLOSE_NOT_PASS")
          trace = json.loads(
              (retry_root / "execution-trace.json").read_text(encoding="utf-8")
          )
          if trace.get("traceStatus") != "PASS":
              raise SystemExit("QUALIFICATION_TRACE_NOT_PASS")
          if trace.get("window", {}).get("closeCommentId") != 200:
              raise SystemExit("QUALIFICATION_SEAL_MOVED")
          attempts = trace.get("attempts") or []
          if len(attempts) != 1:
              raise SystemExit(f"QUALIFICATION_REQUEST_SET_CHANGED:{len(attempts)}")
          if attempts[0].get("requestCommentId") != 110:
              raise SystemExit("QUALIFICATION_REQUEST_FRONTIER_CHANGED")
          if attempts[0].get("resultCommentId") != 230:
              raise SystemExit("QUALIFICATION_LATE_RESULT_NOT_OBSERVED")

          summary = {
              "schemaVersion": "R4AHostedDelayedResultQualification 0.1",
              "targetHead": target,
              "harnessHead": os.environ["GITHUB_SHA"],
              "harnessDelta": changed,
              "firstCloseStatus": "BLOCKED",
              "firstCloseError": first_error,
              "retryCloseStatus": retry_result["status"],
              "sealCommentId": trace["window"]["closeCommentId"],
              "observationCommentId": 260,
              "requestCommentId": attempts[0]["requestCommentId"],
              "lateResultCommentId": attempts[0]["resultCommentId"],
              "operationReplayCount": 0,
              "readOnly": True,
              "semanticAuthority": False,
              "authorizesMutation": False,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload R4A hosted delayed-result qualification
        if: github.ref_name == 'work/operations/m12-at3d-r4a-hosted-qualification-20260830' && always()
        uses: actions/upload-artifact@v4
        with:
          name: r4a-hosted-delayed-result-qualification
          path: /tmp/r4a-hosted-qualification
          if-no-files-found: error
      - name: Toolbox unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Semantic contracts
        run: python -m tools.semantics check --json
      - name: Operational semantics coverage
        run: |
          python -m tools.semantics coverage --json > /tmp/operational-semantics-coverage.json
          python -m json.tool /tmp/operational-semantics-coverage.json > /dev/null
      - name: Upload operational semantics coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-semantics-coverage
          path: /tmp/operational-semantics-coverage.json
          if-no-files-found: error
      - name: Roadmap freshness coverage
        if: github.event_name == 'pull_request'
        run: |
          python tools/roadmap_freshness.py inspect \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --json > /tmp/roadmap-freshness-inspection.json
          python -m json.tool /tmp/roadmap-freshness-inspection.json > /dev/null
      - name: Upload roadmap freshness inspection
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-freshness-inspection
          path: /tmp/roadmap-freshness-inspection.json
          if-no-files-found: error
      - name: Capability lifecycle guard
        if: github.event_name == 'pull_request'
        run: python tools/capability_gates_ci.py --base-sha "${{ github.event.pull_request.base.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}" --json
      - name: Doctor
        run: python tools/agent.py doctor --json
      - name: Verify local coherence
        run: python tools/agent.py verify --json
      - name: Generate Project Machine inspection
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/project_machine.py inspect --live --json > /tmp/project-machine-inspection.json
          python -m json.tool /tmp/project-machine-inspection.json > /dev/null
          python tools/project_machine.py validate /tmp/project-machine-inspection.json --json
      - name: Upload Project Machine inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: project-machine-inspection
          path: /tmp/project-machine-inspection.json
          if-no-files-found: error
      - name: Derive routine inspection
        if: github.event_name == 'pull_request'
        run: |
          python tools/routines.py inspect --input /tmp/project-machine-inspection.json --json > /tmp/routine-inspection.json
          python -m json.tool /tmp/routine-inspection.json > /dev/null
          python tools/routines.py validate /tmp/routine-inspection.json --project-machine /tmp/project-machine-inspection.json --json
      - name: Upload routine inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: routine-inspection
          path: /tmp/routine-inspection.json
          if-no-files-found: error
      - name: Derive maintenance inspection
        if: github.event_name == 'pull_request'
        run: |
          python tools/maintenance_inspect.py --input /tmp/project-machine-inspection.json --routines /tmp/routine-inspection.json --json > /tmp/maintenance-inspection.json
          python -m json.tool /tmp/maintenance-inspection.json > /dev/null
      - name: Upload maintenance inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-inspection
          path: /tmp/maintenance-inspection.json
          if-no-files-found: error
      - name: Derive Scheduler plan
        if: github.event_name == 'pull_request'
        run: |
          python tools/scheduler_plan.py --input /tmp/maintenance-inspection.json --json > /tmp/scheduler-plan.json
          python -m json.tool /tmp/scheduler-plan.json > /dev/null
      - name: Upload Scheduler plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-plan
          path: /tmp/scheduler-plan.json
          if-no-files-found: error
      - name: Generate integration reconcile evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/integration_reconcile.py reconcile-plan "$PR_NUMBER" --json > /tmp/integration-reconcile-plan.json
          python -m json.tool /tmp/integration-reconcile-plan.json > /dev/null
      - name: Upload integration reconcile evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: integration-reconcile-plan
          path: /tmp/integration-reconcile-plan.json
          if-no-files-found: error
      - name: Generate handoff evidence
        run: |
          python tools/agent.py handoff --json > /tmp/agent-handoff.json
          python -m json.tool /tmp/agent-handoff.json > /dev/null
      - name: Upload handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-ops-handoff
          path: /tmp/agent-handoff.json
          if-no-files-found: error
