name: Agent Ops

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'ops/**'
      - 'tools/agent.py'
      - 'tools/coordination*.py'
      - 'tools/lock.py'
      - 'tools/tests/**'
      - 'docs/plans/**'
      - '.github/workflows/agent-ops.yml'
  push:
    branches:
      - 'renderer/**'
      - 'architecture/**'
      - 'ops/**'
    paths:
      - 'AGENTS.md'
      - 'ops/**'
      - 'tools/agent.py'
      - 'tools/coordination*.py'
      - 'tools/lock.py'
      - 'tools/tests/**'
      - 'docs/plans/**'
      - '.github/workflows/agent-ops.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolbox unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Doctor
        run: python tools/agent.py doctor --json

      - name: Verify local coherence
        run: python tools/agent.py verify --json

      - name: Verify remote PR identity
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/agent.py verify --remote --json

      - name: Generate handoff evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/agent.py handoff --json > /tmp/agent-handoff.json
          python -m json.tool /tmp/agent-handoff.json > /dev/null

      - name: Upload handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-ops-handoff
          path: /tmp/agent-handoff.json
          if-no-files-found: error

  coordination-authority-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/git-ops-1.3-coordination-leases'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: mobilipresenter-coordination-authority-probe
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Live authority adapter probe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COORDINATION_PROBE_OUTPUT: /tmp/coordination-live-probe.json
        run: python tools/coordination_probe.py

      - name: Live CI ownership enforcement probe
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATION_CI_PROBE_OUTPUT: /tmp/coordination-ci-probe.json
        run: python tools/coordination_enforcement_probe.py

      - name: Live TTL orphan recovery probe
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATION_RECOVERY_PROBE_OUTPUT: /tmp/coordination-recovery-probe.json
        run: python tools/coordination_recovery_probe.py

      - name: Validate probe evidence
        run: |
          python -m json.tool /tmp/coordination-live-probe.json > /dev/null
          python -m json.tool /tmp/coordination-ci-probe.json > /dev/null
          python -m json.tool /tmp/coordination-recovery-probe.json > /dev/null

      - name: Upload coordination probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: coordination-live-probes
          path: |
            /tmp/coordination-live-probe.json
            /tmp/coordination-ci-probe.json
            /tmp/coordination-recovery-probe.json
          if-no-files-found: error
