name: Supervisor Snapshot

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'ops/**'
      - 'tools/**'
      - 'docs/kickstarts/roles/manager-gitops*.md'
      - '.github/workflows/supervisor-snapshot.yml'
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot regression tests
        run: |
          python -m unittest tools.tests.test_routines tools.tests.test_maintenance_inspect tools.tests.test_scheduler_plan tools.tests.test_scheduler_snapshot tools.tests.test_supervisor_pipeline -v
      - name: Observe source Project Machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/project_machine.py inspect --live --json > /tmp/project-machine-source.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/project-machine-source.exit-code
          python -m json.tool /tmp/project-machine-source.json > /dev/null
          python tools/project_machine.py validate /tmp/project-machine-source.json --json
      - name: Upload source Project Machine diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-machine-source
          path: |
            /tmp/project-machine-source.json
            /tmp/project-machine-source.exit-code
          if-no-files-found: error
          retention-days: 7
      - name: Propagate source Project Machine disposition
        run: |
          rc="$(cat /tmp/project-machine-source.exit-code)"
          if [ "$rc" -ne 0 ]; then
            echo "Project Machine source inspection exited with $rc after diagnostic preservation."
            exit "$rc"
          fi
      - name: Derive routine inspection
        run: |
          python tools/routines.py inspect --input /tmp/project-machine-source.json --json > /tmp/routine-inspection.json
          python -m json.tool /tmp/routine-inspection.json > /dev/null
          python tools/routines.py validate /tmp/routine-inspection.json --project-machine /tmp/project-machine-source.json --json
      - name: Upload routine inspection
        uses: actions/upload-artifact@v4
        with:
          name: routine-inspection
          path: /tmp/routine-inspection.json
          if-no-files-found: error
          retention-days: 7
      - name: Derive Maintenance and SchedulerPlan
        run: |
          python tools/maintenance_inspect.py --input /tmp/project-machine-source.json --routines /tmp/routine-inspection.json --json > /tmp/live-supervisor-inspection.json
          python tools/scheduler_plan.py --input /tmp/live-supervisor-inspection.json --json > /tmp/scheduler-plan.json
          python -m json.tool /tmp/live-supervisor-inspection.json > /dev/null
          python -m json.tool /tmp/scheduler-plan.json > /dev/null
      - name: Build immutable derived snapshot
        run: |
          python tools/scheduler_snapshot.py build \
            --project-machine /tmp/project-machine-source.json \
            --routines /tmp/routine-inspection.json \
            --inspection /tmp/live-supervisor-inspection.json \
            --plan /tmp/scheduler-plan.json \
            --json > /tmp/scheduler-snapshot.json
          python -m json.tool /tmp/scheduler-snapshot.json > /dev/null
      - name: Observe readback Project Machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/project_machine.py inspect --live --json > /tmp/project-machine-readback.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/project-machine-readback.exit-code
          python -m json.tool /tmp/project-machine-readback.json > /dev/null
          python tools/project_machine.py validate /tmp/project-machine-readback.json --json
      - name: Upload readback Project Machine diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-machine-readback
          path: |
            /tmp/project-machine-readback.json
            /tmp/project-machine-readback.exit-code
          if-no-files-found: error
          retention-days: 7
      - name: Propagate readback Project Machine disposition
        run: |
          rc="$(cat /tmp/project-machine-readback.exit-code)"
          if [ "$rc" -ne 0 ]; then
            echo "Project Machine readback inspection exited with $rc after diagnostic preservation."
            exit "$rc"
          fi
      - name: Validate snapshot lineage and drift
        run: |
          python tools/scheduler_snapshot.py validate \
            --snapshot /tmp/scheduler-snapshot.json \
            --source-machine /tmp/project-machine-source.json \
            --routines /tmp/routine-inspection.json \
            --readback-machine /tmp/project-machine-readback.json \
            --json > /tmp/scheduler-snapshot-validation.json
          python -m json.tool /tmp/scheduler-snapshot-validation.json > /dev/null
      - name: Upload Supervisor Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-snapshot
          path: |
            /tmp/project-machine-source.json
            /tmp/routine-inspection.json
            /tmp/live-supervisor-inspection.json
            /tmp/scheduler-plan.json
            /tmp/scheduler-snapshot.json
            /tmp/project-machine-readback.json
            /tmp/scheduler-snapshot-validation.json
          if-no-files-found: error
          retention-days: 7
