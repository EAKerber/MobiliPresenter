name: M13 P0 Cold Archive Reindex Qualification

on:
  push:
    branches:
      - work/operations/m13-p0-cold-archive-cumulative-index-v0.2

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m13-p0-cold-archive-cumulative-index-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current authorities
        run: git fetch origin main archive/cold
      - name: Reconstruct cumulative archive projection and reindex plan
        run: PYTHONPATH=. python .github/qualification/m13_p0_reindex.py
      - name: Prove cumulative archive informs live hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/prune_plan.py generate --json | tee /tmp/m13-p0-live-prune-plan.json
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/m13-p0-live-prune-plan.json', encoding='utf-8'))
          if plan['observations']['complete'] is not True:
              raise SystemExit(f"LIVE_PRUNE_OBSERVATION_INCOMPLETE:{plan['observations']}")
          by = {entry['branch']: entry for entry in plan['entries']}
          expected = {
              'work/developer/appliance-visual-skin-foundation-v0.1': 'a80ffd34967228d6ff6844d4065bc2a09c763ccc',
              'work/developer/technical-drawing-system-v0.1': 'd8f03e8ed71eb373e7647a9275a971e9f6f51d5e',
              'work/operations/test-suite-biopsy-2026-08-28': '8da3d73d75d1fd5772ba17babbb21cbba6e9bf7b',
              'work/ui/environment-realism-v0.1': '57077e0aabaccb45d7f57ac229975fa118cd7c0c',
          }
          archive_prefix = 'cold-archive:'
          verified = []
          for branch, sha in expected.items():
              entry = by.get(branch)
              if entry is None:
                  raise SystemExit(f'EXPECTED_LIVE_ARCHIVED_REF_MISSING:{branch}')
              if entry['sha'] != sha:
                  raise SystemExit(f'EXPECTED_LIVE_ARCHIVED_REF_DRIFT:{branch}:{entry["sha"]}')
              archive_evidence = [x for x in entry['evidence'] if x.startswith(archive_prefix)]
              if archive_evidence != ['cold-archive:04726742e556fdf98924a98c6dbc2a09a2f28ed2']:
                  raise SystemExit(f'COLD_ARCHIVE_EVIDENCE_MISSING:{branch}:{entry["evidence"]}')
              if entry['action'] != 'delete-candidate' or not entry['autoDeleteEligible']:
                  raise SystemExit(f'OLD_ARCHIVED_REF_NOT_RECOVERED:{branch}:{entry["action"]}')
              verified.append(branch)
          result = {
              'status': 'PASS',
              'archiveHead': '04726742e556fdf98924a98c6dbc2a09a2f28ed2',
              'verifiedBranches': verified,
              'planHash': plan['planHash'],
          }
          print(json.dumps(result, indent=2))
          open('/tmp/m13-p0-live-prune-proof.json','w',encoding='utf-8').write(json.dumps(result, indent=2)+'\n')
          PY
      - name: Upload migration qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m13-p0-cold-archive-reindex-qualification
          path: |
            /tmp/cold-archive-cumulative-seed.json
            /tmp/cold-archive-reindex-plan.json
            /tmp/COLD_ARCHIVE.json
            /tmp/cold-archive-migration-evidence.json
            /tmp/m13-p0-live-prune-plan.json
            /tmp/m13-p0-live-prune-proof.json
