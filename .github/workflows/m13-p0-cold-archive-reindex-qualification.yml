name: M13 P0 Cold Archive Reindex Qualification

on:
  push:
    branches:
      - work/operations/m13-p0-cold-archive-cumulative-index-v0.2

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m13-p0-cold-archive-cumulative-index-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current authorities
        run: git fetch origin main archive/cold
      - name: Reconstruct cumulative archive projection and reindex plan
        run: PYTHONPATH=. python .github/qualification/m13_p0_reindex.py
      - name: Upload migration qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m13-p0-cold-archive-reindex-qualification
          path: |
            /tmp/cold-archive-cumulative-seed.json
            /tmp/cold-archive-reindex-plan.json
            /tmp/COLD_ARCHIVE.json
            /tmp/cold-archive-migration-evidence.json
