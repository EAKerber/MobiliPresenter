name: M13 P0 Cold Archive Reindex Qualification

on:
  push:
    branches:
      - work/operations/m13-p0-cold-archive-cumulative-index-v0.2

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m13-p0-cold-archive-cumulative-index-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current authorities
        run: |
          git fetch origin main archive/cold
      - name: Reconstruct cumulative archive projection and reindex plan
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from tools import cold_archive_plan as cold
          from tools.canonical import canonical_json, stable_hash

          REPO = "EAKerber/MobiliPresenter"
          ARCHIVE_BRANCH = "archive/cold"
          INDEX_PATH = "COLD_ARCHIVE.json"

          def git(*args: str, check: bool = True) -> str:
              p = subprocess.run(["git", *args], text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise SystemExit(f"GIT_FAIL:{' '.join(args)}:{(p.stderr or p.stdout).strip()}")
              return p.stdout.strip() if p.returncode == 0 else ""

          archive_head = git("rev-parse", "origin/archive/cold")
          control_sha = git("rev-parse", "origin/main")
          current = archive_head
          observed_commits: list[str] = []
          recovered: dict[tuple[str, str], dict[str, str]] = {}
          conflict_count = 0

          while True:
              raw = git("show", f"{current}:{INDEX_PATH}", check=False)
              if not raw:
                  break
              try:
                  index = json.loads(raw)
              except json.JSONDecodeError:
                  raise SystemExit(f"ARCHIVE_INDEX_JSON_INVALID:{current}")
              if not isinstance(index, dict):
                  raise SystemExit(f"ARCHIVE_INDEX_ROOT_INVALID:{current}")
              if index.get("schemaVersion") not in {
                  cold.LEGACY_INDEX_SCHEMA_VERSION,
                  cold.INDEX_SCHEMA_VERSION,
              }:
                  break
              if index.get("repository") != REPO or index.get("archiveBranch") != ARCHIVE_BRANCH:
                  break
              entries = index.get("entries")
              if not isinstance(entries, list) or not entries:
                  raise SystemExit(f"ARCHIVE_INDEX_ENTRIES_INVALID:{current}")
              observed_commits.append(current)
              normalized = cold._normalize_entries(
                  entries,
                  control_branch="main",
                  archive_branch=ARCHIVE_BRANCH,
                  allow_empty=False,
                  code="COLD_ARCHIVE_MIGRATION_ENTRIES",
              )
              for item in normalized:
                  key = (item["branch"], item["headSha"])
                  previous = recovered.get(key)
                  if previous is None:
                      recovered[key] = item
                  elif previous != item:
                      conflict_count += 1
                      raise SystemExit(
                          f"ARCHIVE_HISTORY_CONFLICT:{item['branch']}:{item['headSha']}"
                      )

              first_parent = git("rev-parse", f"{current}^1", check=False)
              if not first_parent:
                  break
              parent_raw = git("show", f"{first_parent}:{INDEX_PATH}", check=False)
              if not parent_raw:
                  break
              try:
                  parent_index = json.loads(parent_raw)
              except json.JSONDecodeError:
                  break
              if not isinstance(parent_index, dict):
                  break
              if parent_index.get("schemaVersion") not in {
                  cold.LEGACY_INDEX_SCHEMA_VERSION,
                  cold.INDEX_SCHEMA_VERSION,
              }:
                  break
              if parent_index.get("repository") != REPO or parent_index.get("archiveBranch") != ARCHIVE_BRANCH:
                  break
              current = first_parent

          entries = sorted(recovered.values(), key=lambda item: (item["branch"], item["headSha"]))
          if not entries:
              raise SystemExit("ARCHIVE_HISTORY_EMPTY")

          unreachable: list[dict[str, str]] = []
          for item in entries:
              p = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", item["headSha"], archive_head],
                  text=True,
                  capture_output=True,
              )
              if p.returncode != 0:
                  unreachable.append(item)
          if unreachable:
              raise SystemExit(
                  "ARCHIVE_HISTORY_UNREACHABLE:" + ",".join(
                      f"{x['branch']}@{x['headSha']}" for x in unreachable
                  )
              )

          seed = {
              "schemaVersion": cold.INDEX_SCHEMA_VERSION,
              "repository": REPO,
              "archiveBranch": ARCHIVE_BRANCH,
              "controlSha": control_sha,
              "entries": entries,
          }
          Path("/tmp/cold-archive-cumulative-seed.json").write_text(
              canonical_json(seed) + "\n", encoding="utf-8"
          )

          plan = cold.build_plan(
              control_sha=control_sha,
              previous_archive_head=archive_head,
              existing_entries=entries,
              sources=[],
              operation="reindex",
          )
          cold.validate_plan(plan)
          index_content = cold.render_index(plan)
          Path("/tmp/cold-archive-reindex-plan.json").write_text(
              json.dumps(plan, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          Path("/tmp/COLD_ARCHIVE.json").write_text(index_content, encoding="utf-8")

          evidence = {
              "schemaVersion": "ColdArchiveIndexMigrationEvidence 0.1",
              "repository": REPO,
              "archiveHead": archive_head,
              "controlSha": control_sha,
              "archiveCommitsObserved": observed_commits,
              "legacyIndexCount": len(observed_commits),
              "recoveredEntryCount": len(entries),
              "entrySetHash": stable_hash(entries),
              "conflictCount": conflict_count,
              "unreachableCount": len(unreachable),
              "reindexPlanHash": plan["planHash"],
              "renderedIndexSha256": hashlib.sha256(index_content.encode("utf-8")).hexdigest(),
              "status": "PASS",
          }
          Path("/tmp/cold-archive-migration-evidence.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(evidence, indent=2, ensure_ascii=False))
          PY
      - name: Upload migration qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m13-p0-cold-archive-reindex-qualification
          path: |
            /tmp/cold-archive-cumulative-seed.json
            /tmp/cold-archive-reindex-plan.json
            /tmp/COLD_ARCHIVE.json
            /tmp/cold-archive-migration-evidence.json
