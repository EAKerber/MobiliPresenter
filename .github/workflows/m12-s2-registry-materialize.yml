name: M12 S2 Registry Materialize

on:
  push:
    branches:
      - work/operations/m12-s2-ui-role-scoped-remote-git-0.1

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'EAKerber/MobiliPresenter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m12-s2-ui-role-scoped-remote-git-0.1
          fetch-depth: 0
      - name: Materialize exact registry delta
        run: python3 tools/_m12_s2_materialize_registry.py
      - name: Commit registry delta when needed
        shell: bash
        run: |
          if git diff --quiet -- ops/semantics/registry.json; then
            echo "Registry already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/semantics/registry.json
          git commit -m "feat(semantics): register UI role-scoped remote Git mutation"
          git push origin HEAD:work/operations/m12-s2-ui-role-scoped-remote-git-0.1
