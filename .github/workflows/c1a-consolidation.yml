name: C1A Consolidation Harness

on:
  push:
    branches:
      - 'work/operations/paved-road-consolidation-c1a'
    paths:
      - '.github/workflows/c1a-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/operations/paved-road-consolidation-c1a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Characterize duplicate primitives and write paths
        run: |
          echo '=== stable_hash definitions ==='
          grep -RIn --include='*.py' '^def stable_hash' tools || true
          echo '=== qualified stable_hash callers ==='
          grep -RIn --include='*.py' -E '(gates|peer_recovery|snapshot|capability_gates|transition_protocol)\.stable_hash' tools || true
          echo '=== coordination private writer calls outside executor runtime ==='
          grep -RIn --exclude-dir=tests --include='*.py' -E '\._(create_blob|create_tree|create_commit|advance_ref|verify_published_transition)\(' tools | grep -v 'tools/coordination_remote.py' || true
      - name: Apply C1A writer and hash consolidation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise RuntimeError(f'{path}: expected {count} matches, found {found}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Coordination domain owns break-glass planning; admin becomes a thin CLI adapter.
          admin = Path('tools/coordination_admin.py')
          admin_text = admin.read_text(encoding='utf-8')
          policy_start = admin_text.index('def _audit_time(')
          apply_start = admin_text.index('def apply_break_glass(', policy_start)
          policy_block = admin_text[policy_start:apply_start]
          policy_block = policy_block.replace('coordination.', '')
          coordination_path = Path('tools/coordination.py')
          coordination_text = coordination_path.read_text(encoding='utf-8')
          if 'def plan_break_glass(' in coordination_text:
              raise RuntimeError('coordination already contains break-glass planner')
          coordination_path.write_text(coordination_text.rstrip() + '\n\n\n' + policy_block.strip() + '\n', encoding='utf-8')
          admin_text = admin_text[:policy_start] + admin_text[apply_start:]
          admin_text = admin_text.replace('import copy\n', '').replace('from datetime import datetime, timezone\n', 'from datetime import datetime\n')
          admin.write_text(admin_text, encoding='utf-8')

          replace(
              'tools/coordination_remote.py',
              '''    def mutate(\n        self,\n        planner: Callable[[dict[str, Any], datetime], tuple[dict[str, Any], dict[str, Any]]],\n        *,\n        message: str,\n    ) -> AppliedTransition:\n''',
              '''    def mutate(\n        self,\n        planner: Callable[[dict[str, Any], datetime], tuple[dict[str, Any], dict[str, Any]]],\n        *,\n        message: str,\n        expected_revision: str | None = None,\n    ) -> AppliedTransition:\n''',
          )
          replace(
              'tools/coordination_remote.py',
              '''        observed = self.observe()\n        candidate, event = planner(copy.deepcopy(observed.state), observed.authority_now)\n''',
              '''        observed = self.observe()\n        if expected_revision is not None:\n            if not isinstance(expected_revision, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_revision):\n                raise CoordinationRemoteError("COORDINATION_EXPECTED_REVISION_INVALID", "expected revision must be a 40-character commit SHA")\n            if observed.head_sha != expected_revision:\n                raise CoordinationRemoteError(\n                    "COORDINATION_EXPECTED_REVISION_MISMATCH",\n                    f"expected {expected_revision}, observed {observed.head_sha}",\n                )\n        candidate, event = planner(copy.deepcopy(observed.state), observed.authority_now)\n''',
          )

          admin_text = admin.read_text(encoding='utf-8')
          start = admin_text.index('def apply_break_glass(')
          end = admin_text.index('\ndef build_parser()', start)
          replacement = '''def apply_break_glass(\n    authority: GitHubCoordinationAuthority,\n    *,\n    expected_revision: str,\n    admin_owner: dict[str, Any],\n    resources: list[str],\n    reason: str,\n    transition_id: str,\n) -> AppliedTransition:\n    def planner(state: dict[str, Any], authority_now: datetime) -> tuple[dict[str, Any], dict[str, Any]]:\n        return coordination.plan_break_glass(\n            state,\n            admin_owner=admin_owner,\n            resources=resources,\n            reason=reason,\n            now=authority_now,\n            transition_id=transition_id,\n            expected_revision=expected_revision,\n        )\n\n    try:\n        return authority.mutate(\n            planner,\n            message=f"coordination: break-glass {transition_id}",\n            expected_revision=expected_revision,\n        )\n    except CoordinationRemoteError as exc:\n        if exc.code == "COORDINATION_REF_DRIFT":\n            raise CoordinationRemoteError(\n                "COORDINATION_EXPECTED_REVISION_MISMATCH",\n                "authority changed during break-glass transaction",\n            ) from exc\n        raise\n\n'''
          admin.write_text(admin_text[:start] + replacement + admin_text[end+1:], encoding='utf-8')

          # Registry describes the existing admin entrypoint as an adapter, never a writer.
          registry = Path('ops/semantics/registry.json')
          text = registry.read_text(encoding='utf-8')
          marker = '    "coordination-lock-cli": {"module": "tools.lock",'
          if text.count(marker) != 1 or '"coordination-admin-cli"' in text:
              raise RuntimeError('registry coordination adapter insertion point invalid')
          entry = '    "coordination-admin-cli": {"module": "tools.coordination_admin", "owner": "coordination", "kind": "cli-adapter", "sideEffects": true, "readsAuthorities": ["coordination-leases"], "writesAuthorities": [], "readsResources": [], "writesResources": [], "produces": [], "canonicalWriterFor": [], "delegatesTo": ["coordination-executor"]},\n'
          registry.write_text(text.replace(marker, entry + marker), encoding='utf-8')

          # Hash implementation lives only in tools.canonical.
          def canonicalize_hash_module(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8').replace('import hashlib\n', '')
              block = '''\ndef stable_hash(value: Any) -> str:\n    encoded = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")\n    return hashlib.sha256(encoded).hexdigest()\n'''
              if block not in text: raise RuntimeError(f'{path}: stable_hash block not found')
              text = text.replace(block, '')
              anchor = 'from typing import Any\n'
              if anchor not in text: raise RuntimeError(f'{path}: typing import anchor missing')
              text = text.replace(anchor, anchor + 'from tools.canonical import stable_hash\n', 1)
              p.write_text(text, encoding='utf-8')

          canonicalize_hash_module('tools/transition_protocol.py')
          canonicalize_hash_module('tools/peer_recovery.py')

          p = Path('tools/capability_gates.py')
          text = p.read_text(encoding='utf-8').replace('import hashlib\n', '')
          block = '''\ndef stable_hash(payload: dict[str, Any]) -> str:\n    encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")\n    return hashlib.sha256(encoded).hexdigest()\n'''
          if block not in text: raise RuntimeError('capability_gates stable_hash block not found')
          text = text.replace(block, '').replace('from typing import Any\n', 'from typing import Any\nfrom tools.canonical import stable_hash\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/scheduler_snapshot.py')
          text = p.read_text(encoding='utf-8').replace('import hashlib\n', '')
          block = '''\ndef stable_hash(value: dict[str, Any]) -> str:\n    encoded = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")\n    return hashlib.sha256(encoded).hexdigest()\n'''
          if block not in text: raise RuntimeError('scheduler_snapshot stable_hash block not found')
          text = text.replace(block, '').replace('from typing import Any\n', 'from typing import Any\nfrom tools.canonical import stable_hash\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/capability_transition.py')
          text = p.read_text(encoding='utf-8')
          if 'gates.stable_hash' not in text: raise RuntimeError('capability_transition caller missing')
          text = text.replace('from tools import capability_gates as gates\n', 'from tools import capability_gates as gates\nfrom tools.canonical import stable_hash\n', 1).replace('gates.stable_hash', 'stable_hash')
          p.write_text(text, encoding='utf-8')

          p = Path('tools/peer_recovery_bus.py')
          text = p.read_text(encoding='utf-8')
          if 'peer_recovery.stable_hash' not in text: raise RuntimeError('peer_recovery_bus caller missing')
          text = text.replace('from tools import peer_recovery\n', 'from tools import peer_recovery\nfrom tools.canonical import stable_hash\n', 1).replace('peer_recovery.stable_hash', 'stable_hash')
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/supervisor-snapshot.yml')
          text = p.read_text(encoding='utf-8')
          old = 'from tools.capability_gates import stable_hash'
          if text.count(old) != 1: raise RuntimeError('supervisor hash import mismatch')
          p.write_text(text.replace(old, 'from tools.canonical import stable_hash'), encoding='utf-8')

          # Tests follow public surfaces. Executor-internal tests may still exercise private primitives deliberately.
          p = Path('tools/tests/test_scheduler_snapshot.py')
          text = p.read_text(encoding='utf-8').replace('snapshot.stable_hash', 'stable_hash')
          if 'from tools.canonical import stable_hash' not in text:
              text = text.replace('from tools import scheduler_snapshot as snapshot\n', 'from tools import scheduler_snapshot as snapshot\nfrom tools.canonical import stable_hash\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/tests/test_coordination_admin.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from tools.coordination_admin import apply_break_glass, plan_break_glass\n', 'from tools.coordination_admin import apply_break_glass\n')
          text = text.replace('plan_break_glass(', 'coordination.plan_break_glass(')
          classes_start = text.index('class ObserveOnlyAuthority:')
          classes_end = text.index('\n\nclass CoordinationAdminTests', classes_start)
          fake_classes = '''class DelegatingAuthority:\n    def __init__(self, error=None):\n        self.error = error\n        self.calls = []\n\n    def mutate(self, planner, *, message, expected_revision=None):\n        self.calls.append({"message": message, "expectedRevision": expected_revision})\n        if self.error is not None:\n            raise self.error\n        raise AssertionError("successful mutation not expected in this test")\n'''
          text = text[:classes_start] + fake_classes + text[classes_end:]
          stale_start = text.index('    def test_stale_expected_revision_fails_before_object_creation')
          stale_end = text.index('\n    def test_cas_drift_during_break', stale_start)
          stale_test = '''    def test_stale_expected_revision_is_delegated_to_canonical_writer(self):\n        authority = DelegatingAuthority(\n            CoordinationRemoteError("COORDINATION_EXPECTED_REVISION_MISMATCH", "stale")\n        )\n        with self.assertRaises(CoordinationRemoteError) as caught:\n            apply_break_glass(\n                authority,\n                expected_revision=HEAD0,\n                admin_owner=ADMIN,\n                resources=["file:viewer-next/package.json"],\n                reason="emergency",\n                transition_id="stale-break",\n            )\n        self.assertEqual(caught.exception.code, "COORDINATION_EXPECTED_REVISION_MISMATCH")\n        self.assertEqual(authority.calls[0]["expectedRevision"], HEAD0)\n\n'''
          text = text[:stale_start] + stale_test + text[stale_end+1:]
          drift_start = text.index('    def test_cas_drift_during_break')
          drift_end = text.index('\n\n\nif __name__', drift_start)
          drift_test = '''    def test_cas_drift_from_canonical_writer_is_translated(self):\n        authority = DelegatingAuthority(CoordinationRemoteError("COORDINATION_REF_DRIFT", "race"))\n        with self.assertRaises(CoordinationRemoteError) as caught:\n            apply_break_glass(\n                authority,\n                expected_revision=HEAD0,\n                admin_owner=ADMIN,\n                resources=["file:viewer-next/package.json"],\n                reason="emergency",\n                transition_id="race-break",\n            )\n        self.assertEqual(caught.exception.code, "COORDINATION_EXPECTED_REVISION_MISMATCH")\n        self.assertEqual(authority.calls[0]["message"], "coordination: break-glass race-break")\n'''
          text = text[:drift_start] + drift_test + text[drift_end:]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Enforce paved roads
        run: |
          test "$(grep -RIl --include='*.py' '^def stable_hash' tools | sort)" = "tools/canonical.py"
          if grep -RIn --exclude-dir=tests --include='*.py' -E '\._(create_blob|create_tree|create_commit|advance_ref|verify_published_transition)\(' tools | grep -v 'tools/coordination_remote.py'; then
            echo 'private coordination writer primitive escaped canonical executor' >&2
            exit 1
          fi
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python -m tools.semantics check
      - name: Commit consolidation
        run: |
          git config user.name 'MobiliPresenter Operations'
          git config user.email 'actions@users.noreply.github.com'
          git add tools ops/semantics/registry.json .github/workflows/supervisor-snapshot.yml
          git commit -m 'C1A consolidate coordination writer and canonical hashing'
          git push origin HEAD:work/operations/paved-road-consolidation-c1a
