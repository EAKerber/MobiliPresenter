name: R5A1 Qualification Stager

on:
  push:
    branches:
      - work/operations/m12-at3d-r5a1-hosted-qualification-20260830

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize staged Agent Ops workflow
        run: python ops/staging/r5a1_stage_agent_ops.py

      - name: Commit staged workflow blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/staging/r5a1-agent-ops.yml
          git diff --cached --check
          git commit -m "R5A1 qualification: stage Agent Ops workflow blob"
          git push origin HEAD:work/operations/m12-at3d-r5a1-hosted-qualification-20260830
