name: C1A Direct CLI Healing

on:
  push:
    branches:
      - 'work/operations/paved-road-consolidation-c1a'
    paths:
      - '.github/workflows/c1a-cli-heal.yml'

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/operations/paved-road-consolidation-c1a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add one direct-CLI bootstrap pattern
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/scheduler_snapshot.py')
          text = p.read_text(encoding='utf-8')
          old = '''import argparse\nimport json\nfrom pathlib import Path\nfrom typing import Any\nfrom tools.canonical import stable_hash\n'''
          new = '''import argparse\nimport json\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\nROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom tools.canonical import stable_hash  # noqa: E402\n'''
          if text.count(old) != 1:
              raise RuntimeError('scheduler_snapshot bootstrap anchor invalid')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('tools/capability_gates.py')
          text = p.read_text(encoding='utf-8')
          old = '''from pathlib import Path\nfrom typing import Any\nfrom tools.canonical import stable_hash\n\nROOT = Path(__file__).resolve().parents[1]\nCAPABILITY_DIR = ROOT / "ops" / "capabilities"\n'''
          new = '''from pathlib import Path\nfrom typing import Any\n\nROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom tools.canonical import stable_hash  # noqa: E402\n\nCAPABILITY_DIR = ROOT / "ops" / "capabilities"\n'''
          if text.count(old) != 1:
              raise RuntimeError('capability_gates bootstrap anchor invalid')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('tools/peer_recovery.py')
          text = p.read_text(encoding='utf-8')
          old = '''import argparse\nimport json\nimport re\nfrom pathlib import Path\nfrom typing import Any\nfrom tools.canonical import stable_hash\n'''
          new = '''import argparse\nimport json\nimport re\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\nROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom tools.canonical import stable_hash  # noqa: E402\n'''
          if text.count(old) != 1:
              raise RuntimeError('peer_recovery bootstrap anchor invalid')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('tools/tests/test_semantic_topology.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import copy\nimport unittest\nfrom pathlib import Path\n', 'import copy\nimport subprocess\nimport sys\nimport unittest\nfrom pathlib import Path\n', 1)
          anchor = '    def test_stable_hash_has_one_runtime_definition(self):\n'
          method = '''    def test_canonical_hash_direct_cli_entrypoints_bootstrap_root(self):\n        tools_root = Path(__file__).resolve().parents[1]\n        for name in ("capability_gates.py", "peer_recovery.py", "scheduler_snapshot.py"):\n            result = subprocess.run(\n                [sys.executable, str(tools_root / name), "--help"],\n                cwd=tools_root.parent,\n                text=True,\n                capture_output=True,\n                check=False,\n            )\n            self.assertEqual(0, result.returncode, f"{name}: {result.stderr}")\n\n'''
          if text.count(anchor) != 1 or 'test_canonical_hash_direct_cli_entrypoints_bootstrap_root' in text:
              raise RuntimeError('semantic topology CLI test insertion invalid')
          p.write_text(text.replace(anchor, method + anchor), encoding='utf-8')
          PY
      - name: Validate healed direct entrypoints
        run: |
          python tools/capability_gates.py --help > /dev/null
          python tools/peer_recovery.py --help > /dev/null
          python tools/scheduler_snapshot.py --help > /dev/null
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python -m tools.semantics check
      - name: Publish healing
        run: |
          git config user.name 'MobiliPresenter Operations'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/capability_gates.py tools/peer_recovery.py tools/scheduler_snapshot.py tools/tests/test_semantic_topology.py
          git commit -m 'C1A heal canonical imports for direct CLIs'
          git push origin HEAD:work/operations/paved-road-consolidation-c1a
