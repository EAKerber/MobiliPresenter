name: Scene Core

on:
  push:
    branches:
      - main
      - architecture/fixed-view-scene-core-v1
    paths:
      - "scene-core/**"
      - "scene-source/**"
      - ".github/workflows/scene-core.yml"
  pull_request:
    paths:
      - "scene-core/**"
      - "scene-source/**"
      - ".github/workflows/scene-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Scene Core toolchain
        working-directory: scene-core
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Scene Core
        working-directory: scene-core
        run: npm run verify
