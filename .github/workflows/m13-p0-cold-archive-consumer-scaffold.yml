name: M13 P0 Cold Archive Consumer Scaffold

on:
  push:
    branches:
      - work/operations/m13-p0-cold-archive-cumulative-index-v0.2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations/m13-p0-cold-archive-cumulative-index-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch prune consumer for cumulative index
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path("tools/prune_plan.py")
          text = p.read_text(encoding="utf-8")
          old = 'COLD_ARCHIVE_INDEX_SCHEMA = "ColdArchiveIndex 0.1"'
          new = 'COLD_ARCHIVE_LEGACY_INDEX_SCHEMA = "ColdArchiveIndex 0.1"\nCOLD_ARCHIVE_INDEX_SCHEMA = "ColdArchiveIndex 0.2"\nCOLD_ARCHIVE_INDEX_SCHEMAS = {COLD_ARCHIVE_LEGACY_INDEX_SCHEMA, COLD_ARCHIVE_INDEX_SCHEMA}'
          if old not in text:
              raise SystemExit("schema constant not found")
          text = text.replace(old, new, 1)
          start = text.index("def observe_cold_archive(")
          end = text.index("\ndef ancestry_for_ref", start)
          replacement = base64.b64decode("").decode("utf-8")
          text = text[:start] + replacement + "\n" + text[end+1:]
          p.write_text(text, encoding="utf-8")

          p = Path("tools/tests/test_prune_plan.py")
          text = p.read_text(encoding="utf-8")
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit("test insertion marker not found")
          methods = base64.b64decode("").decode("utf-8")
          text = text.replace(marker, "\n" + methods + marker, 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Run focused archive and hygiene tests
        run: |
          python -m unittest tools.tests.test_cold_archive_plan tools.tests.test_prune_plan
          python -m py_compile tools/cold_archive_plan.py tools/prune_plan.py
      - name: Remove scaffold and commit permanent delta
        run: |
          rm -f .github/workflows/m13-p0-cold-archive-consumer-scaffold.yml
          git config user.name "MobiliPresenter Qualification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent delta materialized"
            exit 1
          fi
          git commit -m "Ops: teach branch hygiene cumulative cold archive"
          git push origin HEAD:work/operations/m13-p0-cold-archive-cumulative-index-v0.2
