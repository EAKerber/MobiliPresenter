name: Fixed View I1

on:
  push:
    branches:
      - variant/fixed-view-i1-interactive
    paths:
      - "variant/fixed-view/**"
      - "docs/variant/I1-INTERACTIVE-PROTOTYPE.md"
      - ".github/workflows/fixed-view-i1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-view-i1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify packaged source
        run: python3 variant/fixed-view/materialize_i1.py --verify-only

      - name: Materialize packaged source
        run: python3 variant/fixed-view/materialize_i1.py

      - name: Rebuild runtime data
        run: python3 variant/fixed-view/tools/build_i1.py

      - name: Validate contracts and assets
        run: python3 variant/fixed-view/tools/validate_i1.py

      - name: Run contract tests
        run: python3 -m unittest variant/fixed-view/tests/test_i1_contracts.py

      - name: Confirm generated prototype files
        run: |
          test -s variant/fixed-view/prototype/index.html
          test -s variant/fixed-view/prototype/app.js
          test -s variant/fixed-view/prototype/styles.css
          test -s variant/fixed-view/prototype/runtime-data.js
          test -s variant/fixed-view/prototype/assets.js
