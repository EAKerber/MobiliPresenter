<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Configure módulos e acabamentos mantendo o ambiente sempre visível em uma apresentação de câmera fixa." />
    <title>Configure seu ambiente — Vista fixa</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #f3f2ee; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
    <link rel="stylesheet" href="/src/ui/responsive-allocation.css" />
    <link rel="stylesheet" href="/src/ui/product-presentation.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const defaultUiMode = "%VITE_DEFAULT_UI_MODE%";
        if (defaultUiMode !== "product") return;
        const url = new URL(window.location.href);
        if (url.searchParams.get("controls") === "0" || url.searchParams.get("fidelity") === "1") return;
        if (url.searchParams.has("front")) return;
        url.searchParams.set(
          "front",
          ["01", "02", "03", "04", "05", "06", "07"].map(alias => `${alias}:neutral-greige`).join(",")
        );
        window.history.replaceState(null, "", url);
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
